<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff1c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Add Along! Toddler Math</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B6%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink: #2d2a4a;
    --ink-soft: #5b5680;
    --sky1: #fff1c9;
    --sky2: #d4efff;
    --card: rgba(255, 255, 255, 0.82);
    --g1: #e2f4ff;
    --g1-edge: #72c4f5;
    --g2: #ffe6f1;
    --g2-edge: #ff8fbd;
    --accent: #7a5cff;
    --good: #2fbf68;
    --oops: #ff9f43;
    --slot-edge: #e3dcff;
    --radius: 28px;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", "EmojiOne Color", sans-serif;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Comic Sans MS", "Chalkboard SE", "Comic Neue", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--sky1);
  }

  body {
    font-family: var(--font);
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    background:
      radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.9) 0 60px, transparent 61px),
      radial-gradient(circle at 18% 16%, rgba(255, 255, 255, 0.9) 0 45px, transparent 46px),
      radial-gradient(circle at 84% 10%, rgba(255, 255, 255, 0.85) 0 50px, transparent 51px),
      radial-gradient(circle at 90% 12%, rgba(255, 255, 255, 0.85) 0 38px, transparent 39px),
      linear-gradient(165deg, var(--sky1) 0%, #ffe4ec 45%, var(--sky2) 100%);
    background-attachment: fixed;
  }

  button {
    font: inherit;
    color: inherit;
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }

  .emoji { font-family: var(--emoji); font-style: normal; line-height: 1; }

  /* ---------- Layout ---------- */
  #app, #countApp {
    height: 100vh;
    height: 100dvh;
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "top" "stage" "pad";
    gap: 8px;
    padding:
      max(8px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(10px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }

  @media (orientation: landscape) and (min-width: 600px) {
    #app, #countApp {
      grid-template-columns: minmax(0, 1fr) minmax(250px, 32%);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "top top" "stage pad";
      gap: 12px;
    }
    .pad { align-self: center; --kh: clamp(64px, calc((100dvh - 170px) / 5.3), 118px); }
  }

  #app[hidden], #countApp[hidden], .welcome[hidden] { display: none; }

  /* ---------- Count Quickly ---------- */
  .cstage {
    grid-area: stage;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1.4dvh, 12px);
  }
  .cstats {
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: clamp(15px, 2.4dvh, 20px);
    font-weight: 900;
    color: var(--ink-soft);
  }
  .cfield {
    position: relative;
    flex: 1 1 0;
    min-height: 140px;
    border-radius: var(--radius);
    background: rgba(255, 255, 255, 0.7);
    border: 4px solid #cdbbff;
    container-type: size;
    overflow: hidden;
  }
  .cfield.shake { animation: shake 0.55s ease; }
  /* A centred square holds the 3×3 dice grid, so patterns keep their shape on wide or tall screens. */
  .cgrid {
    position: absolute;
    left: 50%; top: 50%;
    width: min(94cqw, 94cqh);
    height: min(94cqw, 94cqh);
    transform: translate(-50%, -50%);
  }
  .citem {
    position: absolute;
    font-family: var(--emoji);
    line-height: 1;
    font-size: min(19cqw, 19cqh);
    transform: translate(-50%, -50%) rotate(var(--r, 0deg)) scale(var(--s, 1));
    filter: drop-shadow(0 3px 2px rgba(45, 42, 74, 0.25));
    animation: citem-in 0.35s cubic-bezier(.34, 1.56, .64, 1) both;
    animation-delay: calc(var(--i, 0) * 30ms);
    pointer-events: none;
  }
  .cfield.party .citem { animation: citem-party 0.5s ease-in-out infinite alternate; }
  @keyframes citem-in {
    from { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    to { transform: translate(-50%, -50%) rotate(var(--r, 0deg)) scale(var(--s, 1)); opacity: 1; }
  }
  @keyframes citem-party {
    from { transform: translate(-50%, -50%) rotate(var(--r, 0deg)) scale(var(--s, 1)); }
    to { transform: translate(-50%, -62%) rotate(calc(var(--r, 0deg) * -1)) scale(var(--s, 1)); }
  }
  .cans { display: flex; justify-content: center; font-size: clamp(34px, min(9vw, 8dvh), 72px); font-weight: 900; }
  .cpad { --kh: clamp(64px, 11dvh, 110px); }
  /* The subtle countdown: a thin bar along the very bottom of the screen. */
  .ctimer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: clamp(6px, 1.2dvh, 10px);
    background: rgba(122, 92, 255, 0.12);
    z-index: 5;
    pointer-events: none;
  }
  .ctimer i {
    display: block;
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #b9a8ff, #7a5cff);
    transform-origin: left;
    transform: scaleX(1);
    border-radius: 0 4px 4px 0;
  }
  .ctimer.low i { background: linear-gradient(90deg, #ffc28a, #ff9f43); }

  /* ---------- Welcome screen ---------- */
  .welcome {
    position: fixed;
    inset: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    display: flex;
    padding:
      max(16px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(16px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }
  .welcome-inner {
    margin: auto;
    width: min(1100px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 2dvh, 20px);
    text-align: center;
  }
  .welcome-hello { font-size: clamp(56px, 12dvh, 110px); animation: party 0.9s ease-in-out infinite alternate; display: inline-block; }
  .welcome-title {
    margin: 0;
    font-size: clamp(30px, min(8vw, 7dvh), 64px);
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 3px 0 #fff, 0 6px 0 rgba(122, 92, 255, 0.18);
  }
  .welcome-sub { margin: 0; font-size: clamp(18px, min(4.6vw, 3.6dvh), 30px); font-weight: 800; color: var(--ink-soft); }
  .activities {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));
    gap: clamp(12px, 2.4vw, 24px);
    margin-top: 6px;
  }
  .activity {
    position: relative;
    min-height: clamp(150px, 30dvh, 280px);
    border-radius: 32px;
    padding: 18px 16px 22px;
    background: #fff;
    border: 5px solid var(--edge, var(--slot-edge));
    border-bottom-width: 11px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    box-shadow: 0 10px 24px rgba(45, 42, 74, 0.1);
    transition: transform 0.1s ease, border-bottom-width 0.1s ease;
  }
  .activity:active { transform: translateY(5px); border-bottom-width: 6px; }
  .activity.wiggle { animation: shake 0.5s ease; }
  .act-art { font-size: clamp(40px, 9dvh, 76px); line-height: 1.1; }
  .act-name { font-size: clamp(24px, 4.4dvh, 38px); font-weight: 900; }
  .act-desc { font-size: clamp(15px, 2.4dvh, 20px); font-weight: 700; color: var(--ink-soft); }
  .act-go {
    margin-top: 6px;
    padding: 8px 24px;
    border-radius: 999px;
    background: var(--good);
    color: #fff;
    font-size: clamp(18px, 3dvh, 26px);
    font-weight: 900;
    box-shadow: 0 4px 0 #1e8a4a;
  }
  .activity.play { --edge: var(--good); background: linear-gradient(180deg, #fff, #eafff1); }
  .activity.play .act-go { animation: breathe 1.2s ease-in-out infinite; }
  .activity.soon { opacity: 0.7; background: rgba(255, 255, 255, 0.7); }
  .activity.soon .act-art { filter: grayscale(0.6); }
  .soon-tag {
    margin-top: 6px;
    padding: 6px 18px;
    border-radius: 999px;
    background: #efeaff;
    color: var(--accent);
    font-size: clamp(15px, 2.4dvh, 20px);
    font-weight: 900;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    grid-area: top;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .title {
    margin: 0;
    font-size: clamp(20px, 4.2vw, 34px);
    font-weight: 900;
    letter-spacing: 0.5px;
    color: var(--accent);
    text-shadow: 0 2px 0 #fff, 0 4px 0 rgba(122, 92, 255, 0.18);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .tools { display: flex; gap: 8px; flex-shrink: 0; }
  .tool {
    width: 52px; height: 52px;
    border-radius: 18px;
    background: #fff;
    font-size: 28px;
    display: grid; place-items: center;
    box-shadow: 0 4px 0 rgba(45, 42, 74, 0.12), 0 6px 14px rgba(45, 42, 74, 0.08);
    transition: transform 0.1s;
  }
  .tool:active { transform: translateY(3px) scale(0.95); }

  /* ---------- Stage ---------- */
  .stage {
    grid-area: stage;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: clamp(6px, 1.4dvh, 14px);
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  .steps {
    list-style: none;
    margin: 0 auto;
    padding: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .steps li {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 900;
    font-size: 18px;
    background: #fff;
    color: var(--ink-soft);
    border: 3px solid var(--slot-edge);
    transition: transform 0.25s cubic-bezier(.34, 1.56, .64, 1), background 0.25s;
  }
  .steps li.on { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.18); }
  .steps li.done { background: var(--good); color: #fff; border-color: var(--good); }
  .steps .dash { width: 18px; height: 4px; border-radius: 2px; background: var(--slot-edge); border: 0; }

  .prompt {
    margin: 0;
    text-align: center;
    font-weight: 900;
    font-size: clamp(18px, min(4.6vw, 3.8dvh), 36px);
    line-height: 1.2;
    min-height: 2.4em;
    display: flex; align-items: center; justify-content: center;
    padding: 0 6px;
  }
  .prompt.nudge { animation: nudge 0.5s ease; }

  /* ---------- Equation ---------- */
  .stage { container-type: inline-size; }
  .equation {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.6vw, 16px);
    font-size: clamp(34px, min(9vw, 8dvh), 88px);
    /* Long numbers (higher levels) shrink the whole number sentence to fit the width. */
    font-size: min(clamp(34px, min(9vw, 8dvh), 88px), calc(100cqi / (var(--eq-chars, 4) * 0.62 + 4.4)));
    font-weight: 900;
  }
  .equation .op { color: var(--accent); line-height: 1; }
  .slot {
    min-width: 1.35em;
    height: 1.35em;
    padding: 0 0.15em;
    border-radius: 0.32em;
    background: #fff;
    border: 5px solid var(--slot-edge);
    display: grid; place-items: center;
    line-height: 1;
    box-shadow: 0 5px 0 rgba(45, 42, 74, 0.1);
    transition: background 0.3s, border-color 0.3s, color 0.3s;
  }
  .slot.empty { background: rgba(255, 255, 255, 0.55); border-style: dashed; }
  .slot.active { border-color: var(--accent); color: var(--accent); animation: glow 1.4s ease-in-out infinite; }
  .slot.filled { animation: slot-pop 0.45s cubic-bezier(.34, 1.56, .64, 1); }
  #slot1.filled, #slot1.done { color: #1f8fd6; }
  #slot2.filled, #slot2.done { color: #e0467f; }
  .slot.right { background: var(--good); border-color: var(--good); color: #fff; animation: slot-pop 0.5s cubic-bezier(.34, 1.56, .64, 1); }
  .slot.wrong { background: #ffe7cf; border-color: var(--oops); color: #b25c00; }
  .shake { animation: shake 0.55s ease; }

  /* ---------- Board with animal groups ---------- */
  .board {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: clamp(4px, 1.2vw, 14px);
  }
  .group {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    max-width: 460px;
    border-radius: var(--radius);
    border: 4px solid transparent;
    padding: 6px 6px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: opacity 0.3s, transform 0.3s, border-color 0.3s;
  }
  #group1 { background: var(--g1); border-color: var(--g1-edge); }
  #group2 { background: var(--g2); border-color: var(--g2-edge); }
  .group.waiting { opacity: 0.5; border-style: dashed; }
  .group.active { opacity: 1; animation: breathe 1.6s ease-in-out infinite; }
  .gnum {
    font-weight: 900;
    font-size: clamp(22px, 4dvh, 36px);
    min-width: 1.6em; height: 1.6em;
    border-radius: 999px;
    display: grid; place-items: center;
    color: #fff;
    line-height: 1;
  }
  #group1 .gnum { background: #1f8fd6; }
  #group2 .gnum { background: #e0467f; }

  /* The herd is a size container so animals shrink to fit whatever room the card has. */
  .herd {
    flex: 1 1 0;
    min-height: 0;
    align-self: stretch;
    container-type: size;
    display: grid;
    align-content: center;
    justify-content: center;
    gap: 2px 4px;
  }
  .zero {
    font-size: clamp(18px, 3.4dvh, 30px);
    font-weight: 900;
    color: var(--ink-soft);
    border: 4px dashed rgba(224, 70, 127, 0.45);
    border-radius: 999px;
    padding: 0.5em 0.9em;
  }

  .plus-big {
    align-self: center;
    font-size: clamp(30px, 6dvh, 64px);
    font-weight: 900;
    color: var(--accent);
    transition: opacity 0.3s, transform 0.3s;
  }
  .plus-big.hidden { opacity: 0.25; transform: scale(0.7); }

  .animal {
    position: relative;
    font-size: clamp(18px, min(4.4vw, 7.5dvh), 76px);
    font-size: clamp(16px, min(calc(100cqw / (var(--cols, 3) * 1.25)), calc(100cqh / (var(--rows, 3) * 1.25))), 76px);
    width: 1.2em; height: 1.2em;
    display: grid; place-items: center;
    border-radius: 0.35em;
    animation: hop-in 0.5s cubic-bezier(.34, 1.56, .64, 1) both;
    animation-delay: calc(var(--i, 0) * 110ms);
  }
  .animal .bob {
    display: block;
    animation: bob 2.4s ease-in-out infinite;
    animation-delay: var(--b, 0s);
  }
  .animal .face {
    display: block;
    font-family: var(--emoji);
    line-height: 1;
    filter: drop-shadow(0 3px 2px rgba(45, 42, 74, 0.25));
  }
  .animal .face.pop { animation: pop 0.4s cubic-bezier(.34, 1.56, .64, 1); }
  .animal.counted { background: rgba(255, 255, 255, 0.85); box-shadow: 0 0 0 3px #ffd84d inset; }
  .animal .badge {
    position: absolute;
    top: -0.12em; right: -0.12em;
    min-width: 1.5em; height: 1.5em;
    padding: 0 0.3em;
    font-size: 0.34em;
    font-weight: 900;
    border-radius: 999px;
    background: #ffd84d;
    color: var(--ink);
    display: none;
    place-items: center;
    box-shadow: 0 2px 0 rgba(45, 42, 74, 0.2);
  }
  .animal.counted .badge { display: grid; animation: slot-pop 0.35s cubic-bezier(.34, 1.56, .64, 1); }
  .board.wiggle .animal .face { animation: wiggle 0.6s ease 2; }
  .board.party .animal .bob { animation: party 0.55s ease-in-out infinite alternate; }

  /* Take Away: one big group; the animals that leave hop, fade and get a soft cross. */
  #app[data-layout="solo"] #group2,
  #app[data-layout="solo"] #plusBig { display: none; }
  #app[data-layout="solo"] #group1 { max-width: 760px; }

  /* Levels 4+: no pictures or counting helper, just a big number sentence. */
  #app[data-big="true"] #board { display: none; }
  #app[data-big="true"] .stage { justify-content: center; }
  #app[data-big="true"] .equation {
    font-size: min(clamp(40px, min(11vw, 12dvh), 120px), calc(100cqi / (var(--eq-chars, 4) * 0.62 + 4.4)));
  }

  .animal.gone .bob { animation: none; }
  .animal.gone .face {
    opacity: 0.3;
    filter: grayscale(1);
    animation: leave 0.7s ease both;
    animation-delay: calc(var(--g, 0) * 160ms);
  }
  .animal.gone::after {
    content: "✖";
    position: absolute;
    inset: 0;
    display: grid; place-items: center;
    font-family: var(--font);
    font-size: 0.85em;
    font-weight: 900;
    color: #ff5f86;
    opacity: 0;
    pointer-events: none;
    animation: cross-in 0.3s ease forwards;
    animation-delay: calc(var(--g, 0) * 160ms + 450ms);
  }

  /* "Count with me!" sits in its own full-width row at the bottom of the number pad. */
  .count-btn {
    grid-column: 1 / -1;
    min-height: 56px;
    height: calc(var(--kh) * 0.8);
    border-radius: 22px;
    background: #ffd84d;
    border-bottom: 7px solid #d9ae12;
    box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.65), 0 6px 12px rgba(45, 42, 74, 0.1);
    font-size: clamp(18px, calc(var(--kh) * 0.28), 28px);
    font-weight: 900;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform 0.08s ease, border-bottom-width 0.08s ease, opacity 0.2s, filter 0.2s;
  }
  .count-btn:active, .count-btn.pressed { transform: translateY(5px); border-bottom-width: 2px; }
  .count-btn.dim { opacity: 0.38; filter: saturate(0.5); }
  .count-btn[hidden] { display: none; }
  .random-btn { background: #cdbbff; border-bottom-color: #8f74e6; }

  /* ---------- Difficulty levels ---------- */
  .level-tool { position: relative; }
  .level-tool .lvl-badge {
    position: absolute;
    right: -4px; bottom: -4px;
    min-width: 22px; height: 22px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 900;
    display: grid; place-items: center;
    box-shadow: 0 0 0 2px #fff;
  }
  .level-row { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 8px; }
  .level-title { font-size: clamp(16px, 2.6dvh, 22px); font-weight: 900; color: var(--ink-soft); }
  .level-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .level-chip {
    width: 48px; height: 48px;
    border-radius: 16px;
    background: #fff;
    border: 3px solid var(--slot-edge);
    border-bottom-width: 6px;
    font-size: 20px;
    font-weight: 900;
    color: var(--ink);
    transition: transform 0.1s;
  }
  .level-chip:active { transform: translateY(3px); }
  .level-chip[aria-checked="true"] { background: var(--accent); border-color: #5a3ed6; color: #fff; }
  .level-desc { margin: 0; font-size: clamp(15px, 2.4dvh, 19px); font-weight: 700; color: var(--ink-soft); min-height: 1.3em; }
  .level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 8px; text-align: left; }
  .level-opt {
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto;
    column-gap: 10px;
    align-items: center;
    padding: 8px 12px;
    min-height: 64px;
    border-radius: 18px;
    background: #f5f2ff;
    border: 4px solid transparent;
    text-align: left;
  }
  .level-opt[aria-checked="true"] { border-color: var(--accent); background: #fff; }
  .level-opt .lv-n {
    grid-row: 1 / 3;
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    font-size: 20px; font-weight: 900;
  }
  .level-opt .lv-d { font-size: 15px; font-weight: 800; line-height: 1.2; }
  .level-opt .lv-ex { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
  @media (max-width: 430px) { #gameTitle { display: none; } }
  .count-btn.pulse { animation: breathe 1s ease-in-out infinite; }

  /* ---------- Numpad ---------- */
  .pad {
    grid-area: pad;
    --kh: clamp(64px, 9dvh, 96px);
    display: grid;
    grid-template-columns: repeat(3, minmax(64px, 1fr));
    gap: 10px;
    padding: 10px;
    border-radius: var(--radius);
    background: rgba(255, 255, 255, 0.6);
    box-shadow: 0 6px 20px rgba(45, 42, 74, 0.08);
  }
  .key {
    min-width: 64px;
    min-height: 64px;
    height: var(--kh);
    border-radius: 22px;
    background: var(--k, #fff);
    font-size: clamp(30px, calc(var(--kh) * 0.5), 52px);
    font-weight: 900;
    color: var(--ink);
    border-bottom: 7px solid rgba(45, 42, 74, 0.22);
    box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.65), 0 6px 12px rgba(45, 42, 74, 0.1);
    display: grid; place-items: center;
    transition: transform 0.08s ease, border-bottom-width 0.08s ease, opacity 0.2s, filter 0.2s;
  }
  .key:active, .key.pressed { transform: translateY(5px) scale(0.97); border-bottom-width: 2px; filter: brightness(1.06); }
  .key.dim { opacity: 0.38; filter: saturate(0.5); }
  .key.back { --k: #ffd29a; font-size: clamp(26px, calc(var(--kh) * 0.42), 44px); }
  .key.check { --k: #6fe09c; font-size: clamp(26px, calc(var(--kh) * 0.42), 44px); }
  .key.check.ready { animation: breathe 1.1s ease-in-out infinite; }

  /* ---------- Overlays ---------- */
  #fx {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 60;
  }
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(255, 246, 214, 0.55);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  .overlay[hidden] { display: none; }
  .card {
    width: min(560px, 100%);
    max-height: 100%;
    overflow: auto;
    border-radius: 36px;
    background: #fff;
    padding: clamp(18px, 4dvh, 36px) clamp(16px, 4vw, 32px);
    text-align: center;
    box-shadow: 0 12px 0 rgba(122, 92, 255, 0.2), 0 24px 60px rgba(45, 42, 74, 0.2);
    animation: card-in 0.6s cubic-bezier(.34, 1.56, .64, 1) both;
  }
  .card .big-emoji { font-size: clamp(48px, 10dvh, 96px); animation: party 0.6s ease-in-out infinite alternate; display: inline-block; }
  .card .msg {
    margin: 10px 0 18px;
    font-size: clamp(24px, min(6vw, 5dvh), 44px);
    font-weight: 900;
    line-height: 1.25;
    color: var(--ink);
  }
  .card .msg .sum { color: var(--good); white-space: nowrap; }
  .again {
    font-size: clamp(24px, 4.6dvh, 38px);
    font-weight: 900;
    padding: 16px 34px;
    min-height: 72px;
    border-radius: 999px;
    background: var(--good);
    color: #fff;
    box-shadow: 0 7px 0 #1e8a4a;
    transition: transform 0.1s;
    animation: breathe 1.2s ease-in-out infinite;
  }
  .again:active { transform: translateY(5px); box-shadow: 0 2px 0 #1e8a4a; }
  .timer {
    margin: 18px auto 0;
    height: 8px;
    width: 70%;
    border-radius: 4px;
    background: #efeaff;
    overflow: hidden;
  }
  .timer i {
    display: block;
    height: 100%;
    background: var(--accent);
    transform-origin: left;
  }
  .timer i.run { animation: drain var(--auto, 9s) linear forwards; }

  .sheet-card h2 { margin: 0 0 14px; font-size: clamp(22px, 4dvh, 32px); }
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 10px;
  }
  .theme-opt {
    min-height: 76px;
    border-radius: 22px;
    background: #f5f2ff;
    border: 4px solid transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
    font-weight: 800;
    font-size: 13px;
    transition: transform 0.1s;
  }
  .theme-opt .emoji { font-size: 38px; }
  .theme-opt[aria-checked="true"] { border-color: var(--accent); background: #fff; }
  .theme-opt:active { transform: scale(0.94); }
  .close-sheet {
    margin-top: 16px;
    font-size: 22px; font-weight: 900;
    padding: 12px 30px; min-height: 60px;
    border-radius: 999px;
    background: var(--accent); color: #fff;
    box-shadow: 0 5px 0 #5a3ed6;
  }

  /* ---------- Keyframes ---------- */
  @keyframes hop-in {
    0% { transform: translateY(40%) scale(0) rotate(-25deg); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6%); } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.45) rotate(-8deg); } 100% { transform: scale(1); } }
  @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
  @keyframes party { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-22%) rotate(6deg); } }
  @keyframes slot-pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes glow { 0%, 100% { box-shadow: 0 5px 0 rgba(45,42,74,.1), 0 0 0 0 rgba(122,92,255,.35); } 50% { box-shadow: 0 5px 0 rgba(45,42,74,.1), 0 0 0 10px rgba(122,92,255,0); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-12px) rotate(-2deg); }
    30% { transform: translateX(10px) rotate(2deg); }
    45% { transform: translateX(-8px) rotate(-1deg); }
    60% { transform: translateX(6px) rotate(1deg); }
    75% { transform: translateX(-3px); }
  }
  @keyframes nudge { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.08); } }
  @keyframes card-in { from { transform: scale(0.5) translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes leave {
    0% { opacity: 1; filter: none; transform: none; }
    45% { opacity: 1; filter: none; transform: translateY(-40%) rotate(-14deg) scale(1.15); }
    100% { opacity: 0.3; filter: grayscale(1); transform: none; }
  }
  @keyframes cross-in { from { opacity: 0; transform: scale(2); } to { opacity: 0.9; transform: none; } }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  @media (prefers-reduced-motion: reduce) {
    .animal .bob, .group.active, .slot.active, .again, .card .big-emoji, .key.check.ready, .count-btn.pulse, .welcome-hello, .activity.play .act-go { animation: none; }
  }

  /* Short landscape screens (phones on their side) */
  @media (orientation: landscape) and (max-height: 480px) {
    .steps { display: none; }
    .prompt { min-height: 1.3em; }
    .tool { width: 44px; height: 44px; font-size: 22px; border-radius: 14px; }
    /* Too short for 5 keypad rows: use 4 columns (digits + a side column for back / 0 / check). */
    #app, #countApp { grid-template-columns: minmax(0, 1fr) minmax(300px, 44%); }
    #cPad { --kh: 64px; grid-template-columns: repeat(3, minmax(64px, 1fr)); }
    .pad { --kh: 64px; grid-template-columns: repeat(4, minmax(64px, 1fr)); gap: 8px; padding: 8px; }
    .pad .key[data-key="back"] { grid-column: 4; grid-row: 1; }
    .pad .key[data-key="0"] { grid-column: 4; grid-row: 2; }
    .pad .key[data-key="enter"] { grid-column: 4; grid-row: 3; }
    .count-btn { min-height: 52px; height: 52px; }
    .gnum { position: absolute; top: -10px; left: 8px; font-size: 16px; z-index: 1; box-shadow: 0 0 0 3px #fff; }
    .group { padding: 4px; }
  }
  /* Short portrait screens (phones): give the animals every pixel we can */
  @media (orientation: portrait) and (max-height: 760px) {
    .steps { display: none; }
    .prompt { min-height: 2.3em; font-size: clamp(16px, 4.4vw, 22px); }
    .gnum { position: absolute; top: -10px; left: 8px; font-size: 16px; z-index: 1; box-shadow: 0 0 0 3px #fff; }
    .group { padding: 4px; }
    .pad { gap: 6px; padding: 6px; }
    .count-btn { min-height: 52px; height: 52px; }
    .tool { width: 44px; height: 44px; font-size: 22px; border-radius: 14px; }
  }
</style>
</head>
<body>
