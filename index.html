    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, cancel));
    btn.addEventListener('click', (e) => { if (e.detail === 0) openParent(); }); // keyboard users
  }

  /* ---------- Start ---------- */
  function startPlaying() {
    Sound.unlock();
    // Safari only lets a page speak if the first sentence starts inside a tap, so say hello right now.
    Voice.say('Let’s play!');
    els.start.hidden = true;
    els.trophy.hidden = true;
    S.started = true;
    S.timeUp = false;
    S.playMs = 0;
    nextQuestion();
  }

  /* ---------- Input wiring ---------- */
  // Plain taps for buttons outside the game (act on touch-down, keyboard clicks too).
  function onTap(el, handler) {
    el.addEventListener('pointerdown', (e) => {
      if (e.button > 0) return;
      const target = handler.match ? e.target.closest(handler.match) : el;
      if (!target) return;
      e.preventDefault();
      Sound.unlock();
      Voice.unlock();
      handler.fn(target, e);
    });
    el.addEventListener('click', (e) => {
      if (e.detail !== 0) return;
      const target = handler.match ? e.target.closest(handler.match) : el;
      if (target) handler.fn(target, e);
    });
  }

  // Answer taps count when the finger LIFTS on the same card, so a resting palm, a slide onto
  // a card or several fingers at once don't pick anything by accident.
  const fingersDown = new Set();
  let multiTouch = false;
  document.addEventListener('pointerdown', (e) => {
    fingersDown.add(e.pointerId);
    if (fingersDown.size > 1) multiTouch = true;
  }, { capture: true });
  ['pointerup', 'pointercancel'].forEach((ev) => document.addEventListener(ev, (e) => {
    fingersDown.delete(e.pointerId);
    if (!fingersDown.size) setTimeout(() => { if (!fingersDown.size) multiTouch = false; }, 0);
  }, { capture: true }));

  function onRelease(el, match, fn) {
    const pressed = new Map();
    el.addEventListener('pointerdown', (e) => {
      if (e.button > 0) return;
      e.preventDefault();
      Sound.unlock();
      Voice.unlock();
      if (S.demoDone) { S.demoDone(); return; } // a tap during the demo skips it
      const t = e.target.closest(match);
      if (!t) return;
      const palm = e.pointerType === 'touch' && Math.max(e.width || 0, e.height || 0) > 80;
      pressed.set(e.pointerId, { t, bad: palm || multiTouch });
      t.classList.add('pressing');
    });
    el.addEventListener('pointerup', (e) => {
      const p = pressed.get(e.pointerId);
      pressed.delete(e.pointerId);
      if (!p) return;
      p.t.classList.remove('pressing');
      if (p.bad || multiTouch) return;
      const under = document.elementFromPoint(e.clientX, e.clientY);
      if (under && under.closest(match) === p.t) fn(p.t);
    });
    el.addEventListener('pointercancel', (e) => {
      const p = pressed.get(e.pointerId);
      pressed.delete(e.pointerId);
      if (p) p.t.classList.remove('pressing');
    });
    el.addEventListener('click', (e) => { // keyboard activation
      if (e.detail !== 0) return;
      const t = e.target.closest(match);
      if (t) fn(t);
    });
  }

  onTap(els.playBtn, { fn: startPlaying });
  onRelease(els.answers, '.card, .tile', (t) => (t.classList.contains('tile') ? tapTile(t) : choose(t)));
  onRelease(els.prompt, '.critter', tapCritter);
  onTap(els.intro, { fn: () => S.introDone && S.introDone() });
  onTap(els.yourTurn, { fn: () => S.demoDone && S.demoDone() });
  onTap(els.replayBtn, {
    fn: () => {
      if (!S.q || S.inIntro || S.inDemo) return;
      Voice.say(S.q.say);
      restartAnim(els.replayBtn, 'talking');
      setTimeout(() => els.replayBtn.classList.remove('talking'), 1800);
      armIdle();
    }
  });
  holdToOpen(els.parentBtn);
  holdToOpen(els.startParentBtn);
  onTap(els.closeParent, { fn: closeParent });
  onTap(els.soundToggle, {
    fn: () => {
      Sound.muted = !Sound.muted;
      if (Sound.muted) Voice.cancel();
      store.set('muted', Sound.muted);
      renderParent();
    }
  });
  onTap(els.tipsToggle, { fn: () => { showTips = !showTips; store.set('tips', showTips); renderParent(); } });
  onTap(els.sessionPills, {
    match: '[data-min]',
    fn: (b) => { sessionMin = Number(b.dataset.min); store.set('sessionMin', sessionMin); S.timeUp = false; renderParent(); }
  });
  onTap(els.voiceTest, {
    fn: () => {
      Voice.test();
      els.voiceStatus.textContent = 'Speaking…';
      setTimeout(() => { els.voiceStatus.textContent = Voice.describe(); }, 1500);
    }
  });
  onTap(els.skillRows, {
    match: '[data-toggle], [data-try]',
    fn: (b) => (b.dataset.toggle ? toggleSkill(b.dataset.toggle) : tryNow(b.dataset.try))
  });
  els.sheet.addEventListener('pointerdown', (e) => { if (e.target === els.sheet) closeParent(); });

  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    Sound.unlock();
    Voice.unlock();
    if (!els.sheet.hidden) { if (e.key === 'Escape') closeParent(); return; }
    if (!S.started) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startPlaying(); } return; }
    if (S.inIntro) { if (e.key === 'Enter' || e.key === ' ') S.introDone && S.introDone(); return; }
    if (S.inDemo) { if (e.key === 'Enter' || e.key === ' ') S.demoDone && S.demoDone(); return; }
    if (!S.q) return;
    if (e.key === ' ' || (e.key.toLowerCase() === 'r' && S.q.kind !== 'jumble')) { e.preventDefault(); els.replayBtn.click(); return; }
    if (S.q.kind === 'jumble' && /^[a-z]$/i.test(e.key)) {
      const t = els.answers.querySelector(`.tile[data-l="${e.key.toUpperCase()}"]:not(.used)`);
      if (t) tapTile(t);
      return;
    }
    if (/^[1-4]$/.test(e.key)) {
      const c = els.answers.querySelector(`.card[data-i="${Number(e.key) - 1}"]`);
      if (c) choose(c);
    }
  });

  // Toddler-proofing: no pinch zoom, long-press menus or double-tap zoom.
  document.addEventListener('pointerdown', () => Sound.unlock(), { capture: true, passive: true });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd < 350) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener('visibilitychange', () => { if (document.hidden) Voice.cancel(); });

  /* ---------- Boot + test hooks ---------- */
  Sound.muted = !!store.get('muted', false);
  els.parade.innerHTML = SKILL_IDS.filter((id) => !SKILLS[id].paused).map((id, i) => `<span style="--i:${i}">${SKILLS[id].mascot}</span>`).join('');
  renderStickers();

  const describeQ = (q) => q && ({
    kind: q.kind || 'choice', answer: q.answer, labels: q.choices ? q.choices.map((c) => c.label) : null,
    word: q.word || null, tiles: q.tiles || null, say: q.say, praise: q.praise, data: q.data, countTo: q.countTo || 0
  });
  window.SkillMix = {
    config: CONFIG,
    skills: SKILL_IDS,
    make: (id, level = 1) => describeQ(SKILLS[id].make(level)),
    state: () => ({
      started: S.started, skill: S.skill, inIntro: S.inIntro, inDemo: S.inDemo, busy: S.busy, wrongs: S.wrongs,
      counted: S.counted, jpos: S.jpos, stickers: S.stickers.length, block: S.block && { ...S.block },
      ready: S.started && !S.inIntro && !S.inDemo && !S.busy && !!S.q,
      q: describeQ(S.q), playMs: S.playMs, timeUp: S.timeUp
    }),
    // Tests only: switch to a skill straight away (starts a new block with intro + demo).
    force: (id) => { S.forced = id; if (S.started) nextQuestion(); },
    // Tests only: pretend the session time has run out.
    endTime: () => { S.timeUp = true; },
    stats: () => JSON.parse(JSON.stringify(stats)),
    enabled: () => enabled.filter((id) => !SKILLS[id].paused), // the skills that can come up
    labels: Object.fromEntries(SKILL_IDS.map((id) => [id, SKILLS[id].label])),
    paused: SKILL_IDS.filter((id) => SKILLS[id].paused),
    sessionMin: () => sessionMin,
    letterSound: LETTER_SOUND,
    voice: () => Voice.status(),
    audioState: () => Sound.state,
    particles: () => FX.count(),
    soundLog: Sound.log,
    spoken: Voice.log
  };
})();
</script>
</body>
</html>
