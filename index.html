<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff1c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Skill Mix</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%89%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink: #2d2a4a;
    --ink-soft: #5b5680;
    --accent: #7a5cff;
    --good: #2fbf68;
    --oops: #ff9f43;
    --card: #ffffff;
    --skill-bg: #fff1c9;
    --skill-edge: #e0c56a;
    --radius: 28px;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", "EmojiOne Color", sans-serif;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Comic Sans MS", "Chalkboard SE", "Comic Neue", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--skill-bg);
  }

  body {
    font-family: var(--font);
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  button {
    font: inherit;
    color: inherit;
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }

  .emoji { font-family: var(--emoji); font-style: normal; line-height: 1; }

  /* ---------- Layout ---------- */
  #app {
    height: 100%;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 8px;
    padding:
      max(10px, env(safe-area-inset-top))
      max(14px, env(safe-area-inset-right))
      max(12px, env(safe-area-inset-bottom))
      max(14px, env(safe-area-inset-left));
    background:
      radial-gradient(circle at 10% 12%, rgba(255, 255, 255, 0.7) 0 70px, transparent 71px),
      radial-gradient(circle at 88% 85%, rgba(255, 255, 255, 0.55) 0 90px, transparent 91px),
      var(--skill-bg);
    transition: background-color 0.4s;
  }

  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 64px;
  }
  .bar-right { display: flex; align-items: center; gap: 10px; }

  /* Sticker row: 5 slots that fill up, no numbers or words. */
  .stickers { display: flex; gap: 6px; }
  .slot-sticker {
    width: clamp(36px, 9vmin, 52px);
    height: clamp(36px, 9vmin, 52px);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.55);
    border: 3px dashed rgba(45, 42, 74, 0.18);
    display: grid; place-items: center;
    font-size: clamp(22px, 6vmin, 34px);
  }
  .slot-sticker.on { background: #fff; border: 3px solid #ffd84d; animation: pop-in 0.45s cubic-bezier(.34, 1.56, .64, 1); }

  .replay {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: #fff;
    font-size: 38px;
    display: grid; place-items: center;
    box-shadow: 0 6px 0 var(--skill-edge), 0 8px 18px rgba(45, 42, 74, 0.12);
    transition: transform 0.1s;
  }
  .replay:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--skill-edge); }
  .replay.talking { animation: breathe 0.9s ease-in-out infinite; }
  .parent {
    width: 40px; height: 40px;
    border-radius: 12px;
    font-size: 20px;
    opacity: 0.45;
    display: grid; place-items: center;
    position: relative;
  }
  .parent.holding { opacity: 1; }
  .parent.holding::after {
    content: "";
    position: absolute; inset: -4px;
    border-radius: 14px;
    border: 3px solid var(--accent);
    clip-path: inset(0 100% 0 0);
    animation: hold-fill var(--hold, 900ms) linear forwards;
  }

  /* ---------- Question stage ---------- */
  .stage {
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 2.4dvh, 24px);
  }
  .q-prompt {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vw, 20px);
    flex-wrap: wrap;
    padding-top: clamp(30px, 8vmin, 60px);
  }
  /* The game's name tag: mascot + a 2–3 word description, top left of every question. */
  .tag {
    position: absolute;
    left: 0; top: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 16px 4px 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.85);
    border: 3px solid var(--skill-edge);
    max-width: 100%;
  }
  .tag-text { font-size: clamp(16px, 3.6vmin, 28px); font-weight: 900; white-space: nowrap; }
  .mascot {
    font-size: clamp(34px, 8vmin, 60px);
    animation: bob 2.4s ease-in-out infinite;
    filter: drop-shadow(0 4px 3px rgba(45, 42, 74, 0.2));
  }
  .bubble {
    min-width: 1.4em;
    padding: 0.12em 0.35em;
    border-radius: 0.3em;
    background: var(--card);
    border: 6px solid var(--skill-edge);
    font-size: clamp(64px, 20vmin, 170px);
    font-weight: 900;
    line-height: 1.1;
    display: grid; place-items: center;
    box-shadow: 0 8px 0 rgba(45, 42, 74, 0.08);
  }
  .bubble.small { font-size: clamp(40px, 11vmin, 90px); }
  .bubble svg { width: 1em; height: 1em; display: block; }
  .big-emoji { font-family: var(--emoji); font-size: clamp(70px, 22vmin, 180px); line-height: 1; filter: drop-shadow(0 5px 4px rgba(45, 42, 74, 0.2)); }
  .op { font-size: clamp(40px, 11vmin, 90px); font-weight: 900; color: var(--accent); }
  .qmark {
    font-size: clamp(40px, 11vmin, 90px);
    font-weight: 900;
    color: var(--accent);
    min-width: 1.2em; height: 1.3em;
    border-radius: 0.3em;
    border: 5px dashed var(--accent);
    display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.6);
    animation: breathe 1.4s ease-in-out infinite;
  }
  .qmark.done { border-style: solid; animation: pop-in 0.4s cubic-bezier(.34, 1.56, .64, 1); }

  /* Groups of animals (counting, adding, taking away, comparing) */
  .group {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 4px;
    padding: 10px 12px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.75);
    max-width: 100%;
  }
  .critter {
    position: relative;
    font-family: var(--emoji);
    font-size: clamp(38px, 10vmin, 84px);
    line-height: 1;
    padding: 4px;
    border-radius: 16px;
    animation: pop-in 0.45s cubic-bezier(.34, 1.56, .64, 1) both;
    animation-delay: calc(var(--i, 0) * 110ms);
    filter: drop-shadow(0 3px 2px rgba(45, 42, 74, 0.22));
  }
  .critter.pop { animation: pop 0.4s cubic-bezier(.34, 1.56, .64, 1); }
  .critter.counted { background: rgba(255, 255, 255, 0.95); box-shadow: inset 0 0 0 3px #ffd84d; }
  .critter .badge {
    position: absolute; top: -6px; right: -6px;
    min-width: 26px; height: 26px; padding: 0 5px;
    border-radius: 999px;
    background: #ffd84d; color: var(--ink);
    font-family: var(--font); font-size: 16px; font-weight: 900;
    display: grid; place-items: center;
  }
  .critter.gone { opacity: 0.3; filter: grayscale(1); }
  .critter.gone::after {
    content: "✖";
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-family: var(--font); font-weight: 900;
    color: #ff5f86; font-size: 0.8em;
  }
  .critter.leaving { animation: leave 0.7s ease both; animation-delay: calc(var(--g, 0) * 180ms); }

  /* Pattern row */
  .pattern { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: clamp(4px, 1.4vw, 12px); }
  .pattern .pitem { font-family: var(--emoji); font-size: clamp(40px, 11vmin, 90px); line-height: 1; }

  /* Word jumble slots */
  .jumble { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 2dvh, 18px); }
  .slots { display: flex; gap: clamp(6px, 1.6vw, 14px); }
  .jslot {
    width: clamp(60px, 16vmin, 110px);
    height: clamp(68px, 18vmin, 124px);
    border-radius: 18px;
    border: 5px dashed var(--skill-edge);
    background: rgba(255, 255, 255, 0.6);
    display: grid; place-items: center;
    font-size: clamp(40px, 12vmin, 84px);
    font-weight: 900;
  }
  .jslot .ghost { color: rgba(45, 42, 74, 0.18); }
  .jslot.filled { border-style: solid; background: #fff; animation: pop-in 0.35s cubic-bezier(.34, 1.56, .64, 1); }
  .jslot.next { border-color: var(--accent); }

  /* ---------- Answer cards ---------- */
  .q-answers {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: stretch;
    gap: clamp(12px, 3vw, 28px);
    padding-bottom: 4px;
  }
  .card {
    position: relative;
    min-width: 110px;
    min-height: 110px;
    width: clamp(120px, 32vmin, 230px);
    border-radius: var(--radius);
    background: var(--card);
    border: 4px solid rgba(45, 42, 74, 0.06);
    border-bottom: 10px solid var(--skill-edge);
    box-shadow: 0 10px 22px rgba(45, 42, 74, 0.1);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    padding: 12px 10px;
    font-size: clamp(56px, 15vmin, 120px);
    font-weight: 900;
    line-height: 1;
    transition: transform 0.1s ease, opacity 0.35s ease, border-bottom-width 0.1s ease;
    animation: pop-in 0.4s cubic-bezier(.34, 1.56, .64, 1) both;
    animation-delay: calc(var(--i, 0) * 90ms + 150ms);
  }
  .card:active { transform: translateY(5px); border-bottom-width: 5px; }
  .card.wide { width: clamp(150px, 42vw, 360px); font-size: clamp(34px, 9vmin, 64px); }
  .card svg { width: 1em; height: 1em; display: block; }
  .card .pic { font-family: var(--emoji); }
  .card.wrong { animation: shake 0.5s ease; }
  .card.faded { opacity: 0.18; pointer-events: none; filter: grayscale(1); }
  .card.glow { box-shadow: 0 0 0 6px #ffd84d, 0 10px 22px rgba(45, 42, 74, 0.1); animation: breathe 1s ease-in-out infinite; }
  .card.right { border-bottom-color: var(--good); box-shadow: 0 0 0 6px var(--good); animation: cheer 0.6s ease; }
  .dots { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; max-width: 3.6em; font-size: 0.24em; }
  .dots i { width: 0.7em; height: 0.7em; border-radius: 50%; background: var(--accent); display: block; }
  .bubble .dots { font-size: 0.4em; max-width: 5em; gap: 0.25em; }
  .card .group { background: transparent; padding: 0; gap: 2px; }
  .card .group .critter { font-size: clamp(30px, 7.5vmin, 58px); padding: 2px; }

  /* Word-jumble tiles live in the answer area */
  .tile {
    width: clamp(76px, 19vmin, 130px);
    height: clamp(76px, 19vmin, 130px);
    border-radius: 22px;
    background: #fff;
    border-bottom: 9px solid var(--skill-edge);
    box-shadow: 0 8px 18px rgba(45, 42, 74, 0.1);
    font-size: clamp(44px, 12vmin, 84px);
    font-weight: 900;
    display: grid; place-items: center;
    transition: transform 0.1s, opacity 0.3s;
    animation: pop-in 0.4s cubic-bezier(.34, 1.56, .64, 1) both;
    animation-delay: calc(var(--i, 0) * 90ms + 150ms);
  }
  .tile:active { transform: translateY(5px); }
  .tile.used { opacity: 0; pointer-events: none; }
  .tile.wrong { animation: shake 0.5s ease; }
  .tile.glow { box-shadow: 0 0 0 6px #ffd84d; animation: breathe 1s ease-in-out infinite; }

  /* ---------- Pointing hand (demo + idle hint) ---------- */
  .hand {
    position: fixed;
    left: 0; top: 0;
    z-index: 40;
    font-size: 64px;
    pointer-events: none;
    transition: transform 0.6s cubic-bezier(.45, 0, .2, 1), opacity 0.3s;
    filter: drop-shadow(0 6px 6px rgba(45, 42, 74, 0.3));
  }
  .hand.tap { animation: tap 0.5s ease; }

  /* ---------- Skill intro curtain ---------- */
  .intro {
    position: fixed; inset: 0;
    z-index: 30;
    display: grid; place-items: center;
    background: var(--skill-bg);
  }
  .intro-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: intro-in 0.5s cubic-bezier(.34, 1.56, .64, 1) both; }
  .intro-row { display: flex; align-items: center; gap: 20px; }
  .intro-label {
    font-size: clamp(30px, 8vmin, 60px);
    font-weight: 900;
    background: #fff;
    border: 5px solid var(--skill-edge);
    border-radius: 999px;
    padding: 6px 28px;
    text-align: center;
  }
  .intro-mascot { font-family: var(--emoji); font-size: clamp(110px, 32vmin, 240px); animation: party 0.45s ease-in-out infinite alternate; }
  .intro-icon {
    font-family: var(--emoji);
    font-size: clamp(60px, 16vmin, 120px);
    background: #fff;
    border-radius: 32px;
    border: 6px solid var(--skill-edge);
    padding: 12px 16px;
  }

  /* ---------- Start screen ---------- */
  .start {
    position: fixed; inset: 0;
    z-index: 35;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(18px, 4dvh, 36px);
    padding: 20px;
    background: linear-gradient(165deg, #fff1c9 0%, #ffe4ec 45%, #d4efff 100%);
  }
  .parade { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 640px; }
  .parade span { font-family: var(--emoji); font-size: clamp(40px, 10vmin, 72px); animation: bob 2.2s ease-in-out infinite; animation-delay: calc(var(--i) * -0.22s); }
  .play-btn {
    width: clamp(150px, 38vmin, 240px);
    height: clamp(150px, 38vmin, 240px);
    border-radius: 50%;
    background: var(--good);
    color: #fff;
    font-size: clamp(70px, 18vmin, 120px);
    display: grid; place-items: center;
    box-shadow: 0 12px 0 #1e8a4a, 0 18px 40px rgba(45, 42, 74, 0.2);
    animation: breathe 1.3s ease-in-out infinite;
  }
  .play-btn:active { transform: translateY(8px); box-shadow: 0 4px 0 #1e8a4a; }
  .start .parent { position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); }

  /* ---------- Grown-ups sheet ---------- */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
  .overlay {
    position: fixed; inset: 0;
    z-index: 50;
    display: grid; place-items: center;
    padding: 16px;
    background: rgba(45, 42, 74, 0.35);
  }
  .overlay[hidden], .intro[hidden], .start[hidden], .hand[hidden] { display: none; }
  .sheet {
    width: min(620px, 100%);
    max-height: 100%;
    overflow: auto;
    border-radius: 28px;
    background: #fff;
    padding: 20px clamp(16px, 4vw, 28px) 24px;
    user-select: text;
    -webkit-user-select: text;
  }
  .sheet h2 { margin: 0 0 4px; font-size: 26px; }
  .sheet p { margin: 0 0 14px; color: var(--ink-soft); font-size: 15px; }
  .sheet-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid #eee8ff; }
  .skill-row { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #eee8ff; font-size: 16px; }
  .skill-row .emoji { font-size: 28px; }
  .skill-row .stat { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .pill {
    min-height: 44px;
    padding: 8px 16px;
    border-radius: 999px;
    background: #f1ecff;
    font-weight: 800;
    font-size: 15px;
  }
  .pill.on { background: var(--good); color: #fff; }
  .pill.try { background: #fff4c2; }
  .pill.paused { background: #eee; color: var(--ink-soft); cursor: default; }
  .done-btn { margin-top: 16px; width: 100%; min-height: 56px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 20px; font-weight: 900; }


  /* ---------- Taps, mistakes and explanations ---------- */
  .card.pressing, .tile.pressing { transform: translateY(5px) scale(0.98); }
  .card.hint { box-shadow: 0 0 0 5px rgba(255, 216, 77, 0.9), 0 10px 22px rgba(45, 42, 74, 0.1); animation: breathe 1.2s ease-in-out infinite; }
  .critter.paired::after {
    content: "";
    position: absolute; left: 50%; bottom: -10px;
    width: 14px; height: 14px; margin-left: -7px;
    border-radius: 50%;
    background: #ff9f43;
  }
  .critter.unpaired { animation: breathe 0.8s ease-in-out infinite; box-shadow: inset 0 0 0 3px #ff9f43; }
  .extra-dot {
    width: 18px; height: 18px; border-radius: 50%;
    background: #ff5f86;
    align-self: flex-end; margin: 0 6px 4px;
    animation: pop-in 0.3s cubic-bezier(.34, 1.56, .64, 1);
  }
  .group { position: relative; padding-bottom: 16px; }
  .critter.joining { animation: join 0.6s ease both; animation-delay: calc(var(--i, 0) * 120ms); }
  @keyframes join { from { transform: translateX(160%); opacity: 0.4; } to { transform: none; opacity: 1; } }
  .cmp { display: flex; flex-direction: column; align-items: flex-start; gap: 0.12em; padding: 0.2em 0.3em; }
  .dots-row { display: flex; gap: 0.12em; min-height: 0.36em; }
  .dots-row i { width: 0.36em; height: 0.36em; border-radius: 50%; background: var(--accent); display: block; }
  .dots-row.picked i { background: #ff9f43; animation: pop-in 0.3s cubic-bezier(.34, 1.56, .64, 1) both; }
  .plate {
    display: grid;
    grid-template-columns: repeat(5, 1em);
    justify-content: start;
    gap: 4px 6px;
    font-size: clamp(24px, 6vmin, 44px);
    padding: 6px 10px 12px;
    border-radius: 50% / 30%;
    background: radial-gradient(ellipse at center, #fff 55%, #f1ecff 56%);
  }
  .plate .critter { font-size: 1em; padding: 0; }
  .food.paired { box-shadow: inset 0 0 0 2px #ff9f43; border-radius: 10px; }
  .food.extra { background: #fff4b8; border-radius: 10px; animation: breathe 0.8s ease-in-out infinite; }
  .qmark.broken { border-color: #ff5f86; animation: shake 0.5s ease; }
  .shape-host { position: relative; }
  .ghost-shape {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    opacity: 0.6;
    pointer-events: none;
    animation: ghost-in 0.5s ease both;
  }
  @keyframes ghost-in { from { transform: translateX(-60%); opacity: 0; } to { transform: none; opacity: 0.6; } }
  .tile.nofit { animation: nofit 0.55s ease; }
  @keyframes nofit { 0%, 100% { transform: none; } 35% { transform: translateY(-40px) scale(0.92); } 55% { transform: translateY(-30px) rotate(-10deg); } 75% { transform: translateY(-10px) rotate(6deg); } }
  .jslot.nope { animation: shake 0.5s ease; border-color: #ff5f86; }

  /* ---------- Demo ---------- */
  .stage.demo .q-answers, .stage.demo .q-prompt { pointer-events: auto; }
  .watch {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 25;
    font-size: 40px;
    background: #fff;
    border-radius: 999px;
    padding: 4px 16px;
    border: 4px solid var(--skill-edge);
    animation: breathe 1.2s ease-in-out infinite;
  }
  .your-turn {
    position: fixed;
    left: 50%; top: 45%;
    transform: translate(-50%, -50%);
    z-index: 26;
    padding: 14px 34px;
    border-radius: 999px;
    background: var(--good);
    color: #fff;
    font-size: clamp(32px, 8vmin, 60px);
    font-weight: 900;
    white-space: nowrap;
    box-shadow: 0 10px 0 #1e8a4a, 0 16px 40px rgba(45, 42, 74, 0.25);
  }
  .your-turn.show { animation: intro-in 0.45s cubic-bezier(.34, 1.56, .64, 1) both; }
  .caption {
    position: fixed;
    left: 50%; bottom: max(10px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 25;
    max-width: min(92vw, 640px);
    padding: 8px 16px;
    border-radius: 14px;
    background: rgba(45, 42, 74, 0.82);
    color: #fff;
    font-size: clamp(13px, 2.2vmin, 17px);
    font-weight: 700;
    text-align: center;
    pointer-events: none;
  }
  .trophy { font-family: var(--emoji); font-size: clamp(90px, 24vmin, 180px); animation: party 0.6s ease-in-out infinite alternate; }
  .watch[hidden], .your-turn[hidden], .caption[hidden], .trophy[hidden] { display: none; }
  .sheet-row .pills { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .voice-status { font-size: 13px; color: var(--ink-soft); padding: 0 0 8px; }

  /* ---------- Keyframes ---------- */
  @keyframes pop-in { from { transform: scale(0.3); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.4) rotate(-8deg); } 100% { transform: scale(1); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7%); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes party { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-10%) rotate(8deg); } }
  @keyframes cheer { 0% { transform: scale(1); } 40% { transform: scale(1.15) rotate(-3deg); } 100% { transform: scale(1.06); } }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-12px) rotate(-3deg); }
    40% { transform: translateX(10px) rotate(3deg); }
    60% { transform: translateX(-7px); }
    80% { transform: translateX(4px); }
  }
  @keyframes leave {
    0% { opacity: 1; filter: none; transform: none; }
    45% { opacity: 1; filter: none; transform: translateY(-40%) rotate(-14deg) scale(1.15); }
    100% { opacity: 0.3; filter: grayscale(1); transform: none; }
  }
  @keyframes tap { 0%, 100% { scale: 1; } 50% { scale: 0.8; } }
  @keyframes intro-in { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes hold-fill { to { clip-path: inset(0 0 0 0); } }

  @media (prefers-reduced-motion: reduce) {
    .mascot, .qmark, .parade span, .play-btn, .intro-mascot, .card.glow, .tile.glow, .replay.talking { animation: none; }
  }
</style>
</head>
<body>
<noscript><p style="font-size:28px;text-align:center;padding:40px">Please turn on JavaScript to play! 🦉</p></noscript>

<canvas id="fx" aria-hidden="true"></canvas>

<div id="app">
  <header class="bar">
    <div class="stickers" id="stickers" aria-label="Stickers"></div>
    <div class="bar-right">
      <button class="replay" id="replayBtn" type="button" aria-label="Say it again"><span class="emoji">🔊</span></button>
      <button class="parent" id="parentBtn" type="button" aria-label="Grown-ups: press and hold"><span class="emoji">⚙️</span></button>
    </div>
  </header>
  <main class="stage" id="stage">
    <div class="q-prompt" id="prompt" aria-live="polite"></div>
    <div class="q-answers" id="answers"></div>
  </main>
</div>

<div class="hand emoji" id="hand" hidden aria-hidden="true">👆</div>
<div class="watch emoji" id="watch" hidden aria-hidden="true">👀</div>
<button class="your-turn" id="yourTurn" type="button" hidden><span class="emoji">👉</span> Your turn!</button>
<div class="caption" id="caption" hidden></div>

<div class="intro" id="intro" hidden aria-hidden="true">
  <div class="intro-inner" id="introInner">
    <div class="intro-row"><span class="intro-mascot" id="introMascot"></span><span class="intro-icon" id="introIcon"></span></div>
    <div class="intro-label" id="introLabel"></div>
  </div>
</div>

<div class="start" id="start">
  <div class="trophy" id="trophy" hidden aria-hidden="true">🏆</div>
  <div class="parade" id="parade" aria-hidden="true"></div>
  <button class="play-btn" id="playBtn" type="button" aria-label="Play"><span class="emoji">▶️</span></button>
  <button class="parent" id="startParentBtn" type="button" aria-label="Grown-ups: press and hold"><span class="emoji">⚙️</span></button>
</div>

<div class="overlay" id="parentSheet" hidden role="dialog" aria-modal="true" aria-labelledby="parentTitle">
  <div class="sheet">
    <h2 id="parentTitle">Grown-ups</h2>
    <p>Games come in short blocks of 3–4 questions, each opened with a demo. Every skill starts at level 1. Paused skills are never asked, but you can still try them.</p>
    <div class="sheet-row"><span>Sound and voice</span><button class="pill" id="soundToggle" type="button"></button></div>
    <div class="sheet-row"><span>Voice check</span><button class="pill try" id="voiceTest" type="button">Test voice</button></div>
    <div class="voice-status" id="voiceStatus"></div>
    <div class="sheet-row"><span>Session length</span><span class="pills" id="sessionPills"></span></div>
    <div class="sheet-row"><span>Grown-up tips during demos</span><button class="pill" id="tipsToggle" type="button"></button></div>
    <div id="skillRows"></div>
    <button class="done-btn" id="closeParent" type="button">Done</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const THEMES = [
    { id: 'dog',   emoji: '🐶', one: 'puppy',  many: 'puppies' },
    { id: 'cat',   emoji: '🐱', one: 'kitten', many: 'kittens' },
    { id: 'chick', emoji: '🐥', one: 'chick',  many: 'chicks' },
    { id: 'bunny', emoji: '🐰', one: 'bunny',  many: 'bunnies' },
    { id: 'frog',  emoji: '🐸', one: 'frog',   many: 'frogs' },
    { id: 'horse', emoji: '🐴', one: 'horse',  many: 'horses' },
    { id: 'duck',  emoji: '🦆', one: 'duck',   many: 'ducks' },
    { id: 'bird',  emoji: '🐦', one: 'bird',   many: 'birds' },
    { id: 'apple', emoji: '🍎', one: 'apple',  many: 'apples' },
    { id: 'star',  emoji: '⭐', one: 'star',   many: 'stars' }
  ];
  const RANDOM = { id: 'random', emoji: '🎁', one: 'surprise', many: 'Surprise' };

  const $ = (sel) => document.querySelector(sel);

  // Best-effort persistence: storage can be missing or throw (private mode, file://).
  const store = {
    get(key, fallback) {
      try {
        const v = localStorage.getItem('skillmix.' + key);
        return v === null ? fallback : JSON.parse(v);
      } catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem('skillmix.' + key, JSON.stringify(value)); } catch (e) { /* ignore */ }
    }
  };


  /* ================================================================
   * Sound engine — everything synthesized with the Web Audio API
   * ================================================================ */
  const Sound = (() => {
    const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760];
    const log = [];
    let ctx = null, master = null, noiseBuf = null, muted = false;

    function ensure() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try { ctx = new AC(); } catch (e) { return null; }
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.ratio.value = 4;
        master = ctx.createGain();
        master.gain.value = 0.85;
        master.connect(comp);
        comp.connect(ctx.destination);
        const len = Math.floor(ctx.sampleRate * 2);
        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      return ctx;
    }

    function ready(name) {
      if (muted) return null;
      const c = ensure();
      if (!c) return null;
      if (name) { log.push(name); if (log.length > 60) log.shift(); }
      return c;
    }

    function env(g, t, vol, attack, dur) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    }

    function tone({ type = 'sine', freq, freqEnd, start = 0, dur = 0.2, vol = 0.25, attack = 0.005 }) {
      const c = ctx; if (!c || muted) return;
      const t = c.currentTime + start;
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
      env(g, t, vol, attack, dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.05);
    }

    function noise({ start = 0, dur = 0.1, vol = 0.2, type = 'bandpass', freq = 1500, freqEnd, q = 1, attack = 0.004 }) {
      const c = ctx; if (!c || muted) return;
      const t = c.currentTime + start;
      const src = c.createBufferSource();
      src.buffer = noiseBuf;
      src.loop = true;
      const f = c.createBiquadFilter();
      f.type = type;
      f.frequency.setValueAtTime(freq, t);
      if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
      f.Q.value = q;
      const g = c.createGain();
      env(g, t, vol, attack, dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t, Math.random() * 1.5);
      src.stop(t + dur + 0.05);
    }

    function bell(freq, start = 0, vol = 0.18, dur = 0.7) {
      tone({ type: 'sine', freq, start, dur, vol, attack: 0.004 });
      tone({ type: 'sine', freq: freq * 2.01, start, dur: dur * 0.45, vol: vol * 0.3, attack: 0.003 });
      tone({ type: 'triangle', freq: freq * 3, start, dur: dur * 0.2, vol: vol * 0.12, attack: 0.002 });
    }

    function brass(freq, start, dur, vol = 0.07) {
      const c = ctx; if (!c || muted) return;
      const t = c.currentTime + start;
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(700, t);
      lp.frequency.exponentialRampToValueAtTime(3400, t + 0.06);
      lp.frequency.exponentialRampToValueAtTime(1500, t + dur);
      const g = c.createGain();
      env(g, t, vol, 0.02, dur);
      lp.connect(g); g.connect(master);
      [['sawtooth', 1], ['square', 1.004], ['triangle', 0.5]].forEach(([type, mul]) => {
        const o = c.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(freq * mul, t);
        o.connect(lp);
        o.start(t); o.stop(t + dur + 0.05);
      });
    }

    function cheerVoice(start, f0) {
      const c = ctx; if (!c || muted) return;
      const t = c.currentTime + start;
      const o = c.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f0 * 1.9, t + 0.35);
      o.frequency.exponentialRampToValueAtTime(f0 * 1.35, t + 1.1);
      const lfo = c.createOscillator();
      lfo.frequency.value = 5 + Math.random() * 2.5;
      const lfoGain = c.createGain();
      lfoGain.gain.value = f0 * 0.05;
      lfo.connect(lfoGain); lfoGain.connect(o.frequency);
      const bp = c.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(450, t);
      bp.frequency.linearRampToValueAtTime(1100, t + 0.4);
      bp.frequency.linearRampToValueAtTime(700, t + 1.1);
      bp.Q.value = 3;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.035, t + 0.12);
      g.gain.setValueAtTime(0.035, t + 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.25);
      o.connect(bp); bp.connect(g); g.connect(master);
      o.start(t); lfo.start(t);
      o.stop(t + 1.3); lfo.stop(t + 1.3);
    }

    return {
      log,
      unlock() { if (!muted) ensure(); },
      get state() { return ctx ? ctx.state : 'none'; },
      get muted() { return muted; },
      set muted(v) {
        muted = !!v;
        if (ctx) (muted ? ctx.suspend() : ctx.resume()).catch(() => {});
      },

      // Each number key sings its own note on a pentatonic scale.
      key(d) {
        if (!ready('key')) return;
        if (d == null) {
          tone({ type: 'triangle', freq: 440, freqEnd: 300, dur: 0.12, vol: 0.18 });
          return;
        }
        const f = NOTES[d] || 660;
        tone({ type: 'triangle', freq: f, dur: 0.22, vol: 0.2 });
        tone({ type: 'sine', freq: f * 2, dur: 0.08, vol: 0.06 });
        noise({ type: 'highpass', freq: 4000, dur: 0.02, vol: 0.05 });
      },

      // Bubble pop; gets a little higher with every animal counted.
      pop(i = 0) {
        if (!ready('pop')) return;
        const f = 330 * Math.pow(1.07, Math.min(i, 18));
        tone({ type: 'sine', freq: f, freqEnd: f * 2.6, dur: 0.1, vol: 0.28, attack: 0.003 });
        tone({ type: 'sine', freq: f * 3, dur: 0.05, vol: 0.05, attack: 0.002 });
        noise({ type: 'highpass', freq: 3000, dur: 0.015, vol: 0.04 });
      },

      // Sad "wah-wah-wah-waaah" (soft, for a wrong count or time running out).
      sad() {
        if (!ready('sad')) return;
        const c = ctx;
        [[392, 0, 0.22], [370, 0.24, 0.22], [349, 0.48, 0.22], [330, 0.72, 0.7]].forEach(([f, st, d], i) => {
          const t = c.currentTime + st;
          const o = c.createOscillator();
          o.type = 'triangle';
          o.frequency.setValueAtTime(f, t);
          if (i === 3) {
            const lfo = c.createOscillator();
            const lg = c.createGain();
            lfo.frequency.value = 6;
            lg.gain.value = 8;
            lfo.connect(lg); lg.connect(o.frequency);
            lfo.start(t); lfo.stop(t + d + 0.05);
            o.frequency.linearRampToValueAtTime(f * 0.94, t + d);
          }
          const lp = c.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.value = 1200;
          const g = c.createGain();
          env(g, t, 0.2, 0.03, d);
          o.connect(lp); lp.connect(g); g.connect(master);
          o.start(t); o.stop(t + d + 0.05);
        });
      },

      // Soft falling "whoop" as an animal goes away.
      bye(i = 0) {
        if (!ready('bye')) return;
        const f = 700 * Math.pow(0.93, Math.min(i, 9));
        tone({ type: 'sine', freq: f, freqEnd: f * 0.45, dur: 0.22, vol: 0.2, attack: 0.01 });
      },

      // A short tune that belongs to one skill, played on its intro.
      jingle(notes) {
        if (!ready('jingle')) return;
        notes.forEach((f, i) => bell(f, i * 0.11, 0.13, 0.45));
      },

      chime() {
        if (!ready('chime')) return;
        bell(1046.5, 0, 0.16);
        bell(1318.51, 0.09, 0.15);
        bell(1567.98, 0.18, 0.15, 0.9);
      },

      // Soft, friendly "uh-oh" — never harsh.
      boop() {
        if (!ready('boop')) return;
        tone({ type: 'sine', freq: 392, freqEnd: 370, dur: 0.22, vol: 0.22, attack: 0.02 });
        tone({ type: 'sine', freq: 330, freqEnd: 294, start: 0.2, dur: 0.38, vol: 0.2, attack: 0.02 });
      },

      fanfare() {
        if (!ready('fanfare')) return;
        const seq = [[392, 0, 0.13], [523.25, 0.13, 0.13], [659.25, 0.26, 0.13], [783.99, 0.39, 0.24], [659.25, 0.64, 0.12]];
        seq.forEach(([f, s, d]) => brass(f, s, d + 0.05, 0.075));
        [523.25, 659.25, 783.99, 1046.5].forEach((f) => brass(f, 0.76, 1.2, 0.05));
        for (let i = 0; i < 10; i++) {
          bell(1567.98 * Math.pow(2, Math.floor(Math.random() * 5) / 5), 1.0 + i * 0.13, 0.07, 0.5);
        }
      },

      // Crowd: dozens of filtered-noise hand claps + a noise "roar" + swooping "woo!" voices.
      applause(dur = 3) {
        if (!ready('applause')) return;
        const n = Math.round(dur * 48);
        for (let i = 0; i < n; i++) {
          const s = Math.random() * dur;
          const shape = s < 0.4 ? s / 0.4 : 1 - ((s - 0.4) / (dur - 0.4)) * 0.75;
          noise({
            start: 0.25 + s,
            dur: 0.025 + Math.random() * 0.05,
            vol: (0.05 + Math.random() * 0.2) * shape,
            type: 'bandpass',
            freq: 800 + Math.random() * 1800,
            q: 0.7 + Math.random()
          });
        }
        noise({ start: 0.25, dur, vol: 0.05, type: 'bandpass', freq: 1300, q: 0.5, attack: 0.3 });
        for (let k = 0; k < 5; k++) cheerVoice(0.3 + Math.random() * 0.7, 200 + Math.random() * 220);
      },

      whistle() {
        if (!ready('whistle')) return;
        tone({ type: 'sine', freq: 700 + Math.random() * 200, freqEnd: 1900, dur: 0.55, vol: 0.03, attack: 0.05 });
      },

      boom() {
        if (!ready('boom')) return;
        noise({ type: 'lowpass', freq: 1000, freqEnd: 80, dur: 0.8, vol: 0.32, q: 0.8 });
        for (let i = 0; i < 7; i++) {
          noise({ type: 'highpass', freq: 5000, start: 0.1 + Math.random() * 0.6, dur: 0.02, vol: 0.05 });
        }
      }
    };
  })();

  /* ================================================================
   * Voice — native speech synthesis (optional; silently skipped if absent)
   * ================================================================ */
  const Voice = (() => {
    const synth = window.speechSynthesis;
    const log = [];
    const keep = []; // hold on to utterances: some browsers drop ones that get garbage-collected mid-sentence
    let voice = null, unlocked = false, started = 0, lastError = '';

    function pick() {
      if (!synth) return;
      const voices = synth.getVoices() || [];
      const en = voices.filter((v) => /^en/i.test(v.lang));
      voice =
        en.find((v) => /Samantha|Google US English|Karen|Moira|Tessa|Aria|Jenny|Zira|Serena/i.test(v.name)) ||
        en.find((v) => /en[-_]US/i.test(v.lang)) ||
        en[0] || null;
    }
    if (synth) {
      pick();
      if ('onvoiceschanged' in synth) synth.onvoiceschanged = pick;
    }

    const ok = () => !!synth && typeof SpeechSynthesisUtterance !== 'undefined' && !Sound.muted;

    function make(text, { rate = 0.92, pitch = 1.25, volume } = {}) {
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = voice ? voice.lang : 'en-US';
      u.rate = rate;
      u.pitch = pitch;
      if (volume != null) u.volume = volume;
      u.onstart = () => { started += 1; lastError = ''; };
      u.onerror = (e) => { lastError = e.error || 'error'; };
      u.onend = () => { const k = keep.indexOf(u); if (k >= 0) keep.splice(k, 1); };
      keep.push(u);
      if (keep.length > 8) keep.shift();
      return u;
    }

    function status() {
      return { supported: !!synth, voices: synth ? (synth.getVoices() || []).length : 0, voice: voice ? voice.name : '', started, lastError, unlocked };
    }

    return {
      log,
      // Safari (iPad/iPhone) stays silent unless the page's first sentence is started inside a tap.
      // Call this from tap handlers; it queues a silent blank sentence once.
      unlock() {
        if (unlocked || !ok()) return;
        unlocked = true;
        try { synth.speak(make(' ', { volume: 0 })); } catch (e) { lastError = String(e.message || e); }
      },
      say(text, { interrupt = true } = {}) {
        log.push(text);
        if (log.length > 40) log.shift();
        if (!ok()) return;
        try {
          if (synth.paused) synth.resume();
          const u = make(text);
          if (interrupt && (synth.speaking || synth.pending)) {
            synth.cancel();
            // Speaking straight after cancel() can be dropped silently; give it a moment.
            setTimeout(() => synth.speak(u), 80);
          } else {
            synth.speak(u);
          }
        } catch (e) { lastError = String(e.message || e); }
      },
      // Grown-ups "Test voice" button (runs inside the tap, so it also unlocks speech).
      test() {
        if (!synth) return;
        unlocked = true;
        try {
          if (synth.speaking || synth.pending) synth.cancel();
          synth.speak(make('Hello! The voice is working.'));
        } catch (e) { lastError = String(e.message || e); }
      },
      cancel() { try { if (synth) synth.cancel(); } catch (e) { /* ignore */ } },
      status,
      describe() {
        const s = status();
        if (!s.supported) return 'This browser has no built-in voice.';
        return `${s.voices} voice${s.voices === 1 ? '' : 's'} on this device${s.voice ? ` · using ${s.voice}` : ''} · `
          + `${s.started} sentence${s.started === 1 ? '' : 's'} spoken so far${s.lastError ? ` · last problem: ${s.lastError}` : ''}`;
      }
    };
  })();

  /* ================================================================
   * FX — canvas fireworks + confetti particle system (no libraries)
   * ================================================================ */
  const FX = (() => {
    const canvas = $('#fx');
    const g = canvas.getContext('2d');
    const COLORS = ['#ff5e7e', '#ffb13d', '#ffe14d', '#5fd35f', '#3ec5ff', '#8a7dff', '#ff7de9', '#ffffff'];
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const GRAVITY = 600;
    let W = 0, H = 0, dpr = 1;
    let rockets = [], sparks = [], confetti = [];
    let raf = 0, last = 0;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    const rand = (a, b) => a + Math.random() * (b - a);
    const pickColor = () => COLORS[(Math.random() * COLORS.length) | 0];

    function launch(delay = 0) {
      const targetY = H * rand(0.12, 0.42);
      const vy = -Math.sqrt(2 * GRAVITY * (H + 10 - targetY));
      rockets.push({
        x: W * rand(0.12, 0.88), y: H + 10,
        vx: rand(-60, 60), vy,
        delay, launched: false,
        color: pickColor(), color2: pickColor()
      });
      start();
    }

    function explode(r) {
      Sound.boom();
      const n = reduced ? 34 : 80;
      const maxSpeed = rand(220, 320) + Math.min(W, H) * 0.12;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + rand(-0.05, 0.05);
        const s = maxSpeed * (i % 3 === 0 ? 1 : rand(0.35, 0.9));
        const life = rand(1.1, 1.9);
        sparks.push({
          x: r.x, y: r.y,
          vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life, max: life,
          size: rand(2, 3.6),
          color: Math.random() < 0.7 ? r.color : r.color2,
          flicker: Math.random() < 0.4
        });
      }
    }

    function burstConfetti(count) {
      for (let i = 0; i < count; i++) {
        confetti.push({
          x: rand(0, W), y: rand(-H * 0.6, -10),
          vx: rand(-60, 60), vy: rand(60, 200),
          w: rand(7, 13), h: rand(4, 8),
          rot: rand(0, Math.PI * 2), vr: rand(-6, 6),
          phase: rand(0, Math.PI * 2),
          color: pickColor(),
          age: 0
        });
      }
      start();
    }

    function start() {
      if (raf) return;
      last = performance.now();
      raf = requestAnimationFrame(frame);
    }

    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      g.clearRect(0, 0, W, H);

      // Rockets
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        if (r.delay > 0) { r.delay -= dt; continue; }
        if (!r.launched) { r.launched = true; Sound.whistle(); }
        r.vy += GRAVITY * dt;
        r.x += r.vx * dt;
        r.y += r.vy * dt;
        sparks.push({ x: r.x, y: r.y, vx: rand(-20, 20), vy: rand(20, 60), life: 0.45, max: 0.45, size: 2, color: '#ffe9a8', flicker: false });
        if (r.vy >= -20) { explode(r); rockets.splice(i, 1); }
      }

      // Sparks (additive glow)
      g.globalCompositeOperation = 'lighter';
      const drag = Math.pow(0.975, dt * 60);
      for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i];
        p.life -= dt;
        if (p.life <= 0) { sparks.splice(i, 1); continue; }
        p.vx *= drag;
        p.vy = p.vy * drag + 220 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        let a = Math.min(1, p.life / p.max * 1.4);
        if (p.flicker && Math.random() < 0.3) a *= 0.3;
        g.globalAlpha = a;
        g.fillStyle = p.color;
        g.beginPath();
        g.arc(p.x, p.y, p.size * (0.6 + 0.4 * (p.life / p.max)), 0, Math.PI * 2);
        g.fill();
      }
      g.globalCompositeOperation = 'source-over';

      // Confetti (flutters and flips as it falls)
      for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.age += dt;
        c.vy = Math.min(c.vy + 120 * dt, 240);
        c.phase += dt * 5;
        c.x += (c.vx + Math.sin(c.phase) * 40) * dt;
        c.y += c.vy * dt;
        c.rot += c.vr * dt;
        if (c.y > H + 30 || c.age > 9) { confetti.splice(i, 1); continue; }
        g.globalAlpha = c.age > 7 ? Math.max(0, (9 - c.age) / 2) : 1;
        g.save();
        g.translate(c.x, c.y);
        g.rotate(c.rot);
        g.scale(1, Math.cos(c.phase));
        g.fillStyle = c.color;
        g.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        g.restore();
      }
      g.globalAlpha = 1;

      if (rockets.length || sparks.length || confetti.length) {
        raf = requestAnimationFrame(frame);
      } else {
        raf = 0;
        g.clearRect(0, 0, W, H);
      }
    }

    return {
      celebrate() {
        const rocketsN = reduced ? 3 : 7;
        for (let i = 0; i < rocketsN; i++) launch(i * 0.38 + rand(0, 0.15));
        burstConfetti(reduced ? 60 : 170);
      },
      clear() {
        rockets = []; sparks = []; confetti = [];
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
        g.clearRect(0, 0, W, H);
      },
      count() { return rockets.length + sparks.length + confetti.length; },
      confetti(n) { burstConfetti(reduced ? Math.round(n / 3) : n); }
    };
  })();


  /* ================================================================
   * Skill Mix — short blocks of one game at a time, each started with
   * a demo. Answered by tapping big pictures; spoken where speech works.
   * ================================================================ */
  const CONFIG = {
    introMs: 1100,        // game intro curtain (mascot + description + jingle)
    demoStepMs: 800,      // pace of the demo hand
    yourTurnMs: 1000,     // "Your turn!" after the demo
    joinMs: 1000,         // adding: the second group walks over after this long
    rightPauseMs: 1700,   // celebrate a right answer before the next question
    explainMs: 2400,      // how long a mistake's explanation stays on screen
    hintAfter: 3,         // wrong tries before the right card starts to pulse
    glowAfter: 5,         // wrong tries before it glows
    idleHintMs: 8000,     // say it again + point at the cards after this long without a tap
    bigPartyMs: 3400,     // the 5-sticker celebration
    holdMs: 900,          // press and hold ⚙️ this long to open the grown-ups sheet
    blockMin: 3,          // questions per game before switching
    blockMax: 4
  };

  const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  const other = (lo, hi, not) => { let v; do { v = randInt(lo, hi); } while (v === not); return v; };
  const otherFrom = (arr, not) => pick(arr.filter((x) => x !== not));

  function restartAnim(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  /* ---------- Content ---------- */
  // How each capital letter is *named* when spoken (a lone "A" is often read as the word "a").
  const LETTER_NAME = {
    A: 'ay', B: 'bee', C: 'see', D: 'dee', E: 'ee', F: 'ef', G: 'jee', H: 'aitch', I: 'eye', J: 'jay', K: 'kay', L: 'el', M: 'em',
    N: 'en', O: 'oh', P: 'pee', Q: 'cue', R: 'ar', S: 'ess', T: 'tee', U: 'you', V: 'vee', W: 'double you', X: 'ex', Y: 'why', Z: 'zee'
  };
  // How each capital letter's *sound* is spoken in "Starts with…". Speech engines differ,
  // so if one sounds wrong on your device, change its spelling here.
  const LETTER_SOUND = {
    A: 'ah', B: 'buh', C: 'kuh', D: 'duh', E: 'eh', F: 'fff', G: 'guh', H: 'huh', I: 'ih', J: 'juh', K: 'kuh', L: 'lll', M: 'mmm',
    N: 'nnn', O: 'aw', P: 'puh', Q: 'kwuh', R: 'rrr', S: 'sss', T: 'tuh', U: 'uh', V: 'vvv', W: 'wuh', X: 'ks', Y: 'yuh', Z: 'zzz'
  };
  // Picture words (no Q or X: no clear toddler picture word).
  const WORDS = {
    A: ['apple', '🍎'], B: ['bear', '🐻'], C: ['cat', '🐱'], D: ['dog', '🐶'], E: ['egg', '🥚'], F: ['fish', '🐟'], G: ['goat', '🐐'],
    H: ['hat', '🎩'], J: ['juice', '🧃'], K: ['kite', '🪁'], L: ['lion', '🦁'], M: ['moon', '🌙'], N: ['nose', '👃'], O: ['octopus', '🐙'],
    P: ['pig', '🐷'], R: ['rabbit', '🐰'], S: ['sun', '☀️'], T: ['tiger', '🐯'], U: ['umbrella', '☂️'], V: ['volcano', '🌋'],
    W: ['watermelon', '🍉'], Y: ['yo-yo', '🪀'], Z: ['zebra', '🦓']
  };
  const STARTS_L1 = ['A', 'B', 'D', 'F', 'M', 'P', 'S', 'T']; // clear, different first sounds
  // "First letter": letter pairs that look too alike to put side by side at level 1.
  const LOOKALIKE_LETTERS = ['B|P', 'P|B', 'B|D', 'D|B', 'F|P', 'P|F'];
  const JUMBLE_L1 = [
    ['CAT', '🐱'], ['DOG', '🐶'], ['SUN', '☀️'], ['BUS', '🚌'], ['PIG', '🐷'],
    ['HAT', '🎩'], ['COW', '🐮'], ['FOX', '🦊'], ['BED', '🛏️'], ['CUP', '☕']
  ];
  const COLORS = [
    { e: '🔴', n: 'red' }, { e: '🔵', n: 'blue' }, { e: '🟡', n: 'yellow' },
    { e: '🟢', n: 'green' }, { e: '🟣', n: 'purple' }, { e: '🟠', n: 'orange' }
  ];
  const LOOKALIKE_COLORS = ['red|orange', 'orange|red', 'blue|purple', 'purple|blue'];
  const SHAPES = {
    circle: { name: 'circle', svg: '<circle cx="50" cy="50" r="42"/>' },
    square: { name: 'square', svg: '<rect x="10" y="10" width="80" height="80" rx="6"/>' },
    triangle: { name: 'triangle', svg: '<polygon points="50,8 94,90 6,90"/>' },
    star: { name: 'star', svg: '<polygon points="50,5 61,38 96,38 68,59 79,93 50,72 21,93 32,59 4,38 39,38"/>' },
    heart: { name: 'heart', svg: '<path d="M50 88C20 65 5 45 5 28 5 14 16 5 29 5c10 0 17 6 21 13 4-7 11-13 21-13 13 0 24 9 24 23 0 17-15 37-45 60z"/>' }
  };
  const SHAPES_L1 = ['circle', 'square', 'triangle', 'star', 'heart'];
  const shapeSvg = (id, fill = '#7a5cff') => `<svg viewBox="0 0 100 100" fill="${fill}" aria-hidden="true">${SHAPES[id].svg}</svg>`;
  const ANIMALS = THEMES.map((t) => t.emoji);
  const FOODS = ['🍪', '🍓', '🍎', '🧁', '🍌', '🥕', '🍩'];
  const STICKERS = ['⭐', '🌈', '🍭', '🎈', '🦄', '🌟', '🍩', '🚀', '🌸', '🧸'];

  const dots = (n) => `<span class="dots" aria-hidden="true">${'<i></i>'.repeat(n)}</span>`;
  const numberCard = (n) => ({ html: `<span>${n}</span>${dots(n)}`, label: String(n) });
  const critters = (emoji, n, goneFrom = Infinity) =>
    Array.from({ length: n }, (_, i) =>
      `<span class="critter${i >= goneFrom ? ' will-go' : ''}" style="--i:${i};--g:${Math.max(0, i - goneFrom)}">${emoji}</span>`).join('');
  const group = (emoji, n, cls = '') => `<div class="group ${cls}">${critters(emoji, n)}</div>`;

  // Put the right answer and one distractor in a random order.
  function twoChoices(right, wrong, toCard) {
    const order = shuffle([right, wrong]);
    return { choices: order.map(toCard), answer: order.indexOf(right) };
  }

  /* ---------- Showing what a mistake means ---------- */
  const qs = (sel, root = els.prompt) => [...root.querySelectorAll(sel)];

  // Line up the number picked against the animals: a dot under each one it covers,
  // red dots for "too many", a "?" on the ones it leaves out.
  function explainCount(picked) {
    const cs = qs('.critter:not(.gone)');
    cs.forEach((c, i) => c.classList.add(i < picked ? 'paired' : 'unpaired'));
    const g = cs.length ? cs[cs.length - 1].parentElement : null;
    for (let i = cs.length; i < picked && g; i++) g.insertAdjacentHTML('beforeend', '<span class="extra-dot" aria-hidden="true"></span>');
  }
  function clearCount() {
    qs('.critter').forEach((c) => c.classList.remove('paired', 'unpaired'));
    qs('.extra-dot').forEach((d) => d.remove());
  }

  /* ---------- The skills, level 1 (tuned for a 3-year-old) ---------- */
  function makeNumbers() {
    const n = randInt(1, 5);
    return {
      ...twoChoices(n, other(1, 5, n), numberCard),
      prompt: `<div class="bubble cmp"><div class="dots-row target">${'<i></i>'.repeat(n)}</div><div class="dots-row picked"></div></div>`,
      say: `Find ${n}!`, retry: 'Look at the dots!', praise: `Yes! ${n}!`, data: { n },
      // The picked number's dots appear under the question's dots, so the extra or missing ones show.
      explain: (label) => { els.prompt.querySelector('.dots-row.picked').innerHTML = '<i></i>'.repeat(Number(label)); },
      unexplain: () => { const r = els.prompt.querySelector('.dots-row.picked'); if (r) r.innerHTML = ''; }
    };
  }

  function makeLetters() {
    const t = pick(STARTS_L1);
    let d;
    do { d = otherFrom(STARTS_L1, t); } while (LOOKALIKE_LETTERS.includes(`${t}|${d}`));
    const [word, e] = WORDS[t];
    return {
      ...twoChoices(t, d, (l) => ({ html: `<span>${l}</span>`, label: l })),
      prompt: `<div class="bubble"><span class="emoji">${e}</span></div>`,
      say: `${word}! What does ${word} start with?`, retry: 'Try again!', praise: `Yes! ${word} starts with ${LETTER_NAME[t]}!`,
      data: { letter: t, word, distractor: d }
    };
  }

  function makeCounting() {
    const n = randInt(1, 6);
    return {
      ...twoChoices(n, other(1, 6, n), numberCard),
      prompt: `${group(pick(ANIMALS), n, 'countable')}<span class="op">=</span><span class="qmark">?</span>`,
      fill: String(n), countTo: n, say: 'How many?', retry: 'Let’s count them!', praise: `${n}!`, data: { n },
      explain: (label) => explainCount(Number(label)), unexplain: clearCount
    };
  }

  function makeStarts() {
    const t = pick(STARTS_L1);
    const d = otherFrom(STARTS_L1, t);
    const [word] = WORDS[t];
    return {
      ...twoChoices(t, d, (l) => ({ html: `<span class="pic">${WORDS[l][1]}</span>`, label: WORDS[l][0] })),
      prompt: `<div class="bubble">${t}</div>`,
      say: `${LETTER_NAME[t]}. ${LETTER_SOUND[t]}. Which one starts with ${LETTER_SOUND[t]}?`, retry: 'Try again!',
      praise: `${word}! ${LETTER_SOUND[t]}, ${word}!`, data: { letter: t, word, distractor: WORDS[d][0] }
    };
  }

  // Adding: two groups, then the second group walks over and joins the first. Count them all.
  function makeAddition() {
    let a, b;
    do { a = randInt(1, 4); b = randInt(1, 4); } while (a + b > 5);
    const e = pick(ANIMALS);
    const sum = a + b;
    return {
      ...twoChoices(sum, other(1, 5, sum), numberCard),
      prompt: `<div class="group countable g-a">${critters(e, a)}</div><span class="op plus">+</span>${group(e, b, 'g-b')}<span class="op">=</span><span class="qmark">?</span>`,
      after: () => later(() => {
        const ga = els.prompt.querySelector('.g-a'), gb = els.prompt.querySelector('.g-b');
        if (!ga || !gb) return;
        [...gb.children].forEach((c, i) => { c.classList.add('joining'); c.style.setProperty('--i', String(i)); ga.append(c); });
        gb.remove();
        els.prompt.querySelector('.plus')?.remove();
        Sound.pop(5);
      }, CONFIG.joinMs),
      fill: String(sum), countTo: sum, say: `${a} and ${b} more. How many altogether?`, retry: 'Let’s count them all!',
      praise: `${a} and ${b} make ${sum}!`, data: { a, b },
      explain: (label) => explainCount(Number(label)), unexplain: clearCount
    };
  }

  function makeSubtraction() {
    const [a, b] = pick([[2, 1], [3, 1], [3, 2]]);
    const left = a - b;
    return {
      ...twoChoices(left, other(1, 3, left), numberCard),
      prompt: `<div class="group">${critters(pick(ANIMALS), a, left)}</div><span class="op">=</span><span class="qmark">?</span>`,
      after: () => later(() => {
        els.prompt.querySelectorAll('.critter.will-go').forEach((c) => c.classList.add('gone', 'leaving'));
        for (let i = 0; i < b; i++) later(() => Sound.bye(i), i * 180);
      }, 900),
      fill: String(left), say: `${a}. ${b} ${b === 1 ? 'goes' : 'go'} away. How many are left?`, retry: 'Try again!',
      praise: `${a} take away ${b} is ${left}!`, data: { a, b }
    };
  }

  function makeJumble() {
    const [word, e] = pick(JUMBLE_L1);
    let tiles;
    do { tiles = shuffle(word.split('')); } while (tiles.join('') === word);
    const spoken = word.toLowerCase();
    return {
      kind: 'jumble', word, tiles,
      prompt: `<div class="jumble"><span class="big-emoji">${e}</span><div class="slots">${word.split('').map((l, i) =>
        `<div class="jslot${i === 0 ? ' next' : ''}" data-i="${i}"><span class="ghost">${l}</span></div>`).join('')}</div></div>`,
      say: `${spoken}! Can you make ${spoken}? Find ${LETTER_NAME[word[0]]}.`,
      praise: `${word.split('').map((l) => LETTER_NAME[l]).join(', ')}. ${spoken}!`, data: { word }
    };
  }

  // Which has more? A hungry face and two plates; one plate has at least twice as much.
  function makeCompare() {
    const small = randInt(1, 4);
    const big = randInt(2 * small, Math.min(10, 2 * small + 4));
    const [a, b] = shuffle([small, big]);
    const food = pick(FOODS);
    const plate = (n) => `<div class="plate">${Array.from({ length: n }, (_, i) => `<span class="critter food" style="--i:${i}">${food}</span>`).join('')}</div>`;
    const cardEls = () => [...els.answers.querySelectorAll('.card')];
    return {
      choices: [a, b].map((n) => ({ html: plate(n), label: `${n}`, cls: 'wide' })),
      answer: a > b ? 0 : 1,
      prompt: '<div class="bubble"><span class="emoji">😋</span></div>',
      say: 'Which plate has more?', retry: 'Look! Which has more?', praise: 'Yes! That one has more!', data: { a, b },
      // Line the two plates up one to one: the leftovers on the bigger plate light up.
      explain: () => {
        const [p0, p1] = cardEls().map((c) => [...c.querySelectorAll('.food')]);
        const m = Math.min(p0.length, p1.length);
        [p0, p1].forEach((items) => items.forEach((f, i) => f.classList.add(i < m ? 'paired' : 'extra')));
      },
      unexplain: () => els.answers.querySelectorAll('.food').forEach((f) => f.classList.remove('paired', 'extra'))
    };
  }

  function makePattern() {
    let A, B;
    do { A = pick(COLORS); B = otherFrom(COLORS, A); } while (LOOKALIKE_COLORS.includes(`${A.n}|${B.n}`));
    const len = randInt(4, 5);
    const seq = Array.from({ length: len }, (_, i) => (i % 2 ? B : A));
    const next = len % 2 ? B : A;
    const byName = { [A.n]: A, [B.n]: B };
    return {
      ...twoChoices(next, next === A ? B : A, (c) => ({ html: `<span class="pic">${c.e}</span>`, label: c.n })),
      prompt: `<div class="pattern">${seq.map((c) => `<span class="pitem">${c.e}</span>`).join('')}<span class="qmark">?</span></div>`,
      fill: `<span class="emoji">${next.e}</span>`, say: 'What comes next?', retry: 'Does it fit? Look again!', praise: `Yes! ${next.n}!`,
      data: { seq: seq.map((c) => c.n), next: next.n },
      // Try the picked colour in the gap: the pattern visibly breaks.
      explain: (label) => {
        const qm = els.prompt.querySelector('.qmark');
        qm.innerHTML = `<span class="emoji">${byName[label].e}</span>`;
        restartAnim(qm, 'broken');
      },
      unexplain: () => { const qm = els.prompt.querySelector('.qmark'); if (qm) { qm.textContent = '?'; qm.classList.remove('broken'); } }
    };
  }

  function makeShapes() {
    const t = pick(SHAPES_L1);
    return {
      ...twoChoices(t, otherFrom(SHAPES_L1, t), (s) => ({ html: shapeSvg(s), label: SHAPES[s].name })),
      prompt: `<div class="bubble shape-host">${shapeSvg(t)}</div>`,
      say: 'Find the same shape!', retry: 'Same shape? Look again!', praise: `Yes! A ${SHAPES[t].name}!`, data: { shape: t },
      // Lay the picked shape over the question's shape: they don't match.
      explain: (label) => {
        els.prompt.querySelector('.shape-host').insertAdjacentHTML('beforeend', `<div class="ghost-shape">${shapeSvg(label, '#ff9f43')}</div>`);
      },
      unexplain: () => qs('.ghost-shape').forEach((g) => g.remove())
    };
  }

  // `label`: 2–3 words shown in the intro and on every question. `tip`: a line for grown-ups during the demo.
  // `paused` skills stay in the code (and "Try now") but are never picked.
  const SKILLS = {
    numbers:     { name: 'Numbers',         label: 'Find the number',     mascot: '🦉', icon: '🔢', bg: '#dcefff', edge: '#8cc6f2', notes: [523, 659, 784], make: makeNumbers,
                   tip: 'Count the dots together, then find that number.' },
    letters:     { name: 'First letter',    label: 'Which first letter?', paused: true, mascot: '🐝', icon: '🔤', bg: '#fff3bd', edge: '#e8c64a', notes: [784, 659, 523], make: makeLetters,
                   tip: 'Say the word slowly and stretch the first sound.' },
    counting:    { name: 'Counting',        label: 'How many?',           mascot: '🐿️', icon: '👆', bg: '#dff6d0', edge: '#86cf6a', notes: [523, 587, 659, 784], make: makeCounting,
                   tip: 'Touch each animal once as you count. The last number is how many.' },
    starts:      { name: 'Starts with…',    label: 'Starts with…',        paused: true, mascot: '🦜', icon: '🗣️', bg: '#ffe3c8', edge: '#f3a55f', notes: [659, 784, 880], make: makeStarts,
                   tip: 'Say the letter’s sound, then each picture’s name.' },
    addition:    { name: 'Adding',          label: 'Add them up',         mascot: '🐻', icon: '➕', bg: '#ffdcea', edge: '#f28db5', notes: [523, 784, 1047], make: makeAddition,
                   tip: 'Watch them join, then count them all.' },
    subtraction: { name: 'Taking away',     label: 'Take away',           paused: true, mascot: '🐰', icon: '➖', bg: '#eadfff', edge: '#ab8ff0', notes: [1047, 784, 523], make: makeSubtraction,
                   tip: 'Count the ones that are left.' },
    jumble:      { name: 'Word jumble',     label: 'Spell the word',      mascot: '🐙', icon: '🧩', bg: '#d2f4ef', edge: '#5cc9b8', notes: [587, 784, 988], make: makeJumble,
                   tip: 'Find the letter that matches the faint one.' },
    compare:     { name: 'More or fewer',   label: 'Which has more?',     mascot: '🐘', icon: '⚖️', bg: '#e2e9f6', edge: '#8fa3cc', notes: [392, 523, 659], make: makeCompare,
                   tip: 'Which plate would you want? Point to the one with more.' },
    pattern:     { name: 'What comes next', label: 'What comes next?',    mascot: '🐛', icon: '🔁', bg: '#eef8c8', edge: '#b3d152', notes: [523, 659, 523, 659], make: makePattern,
                   tip: 'Say the pattern out loud: red, blue, red, blue…' },
    shapes:      { name: 'Shapes',          label: 'Same shape',          mascot: '🦊', icon: '🔺', bg: '#ffe5da', edge: '#f39a78', notes: [880, 784, 659, 784], make: makeShapes,
                   tip: 'Name the shape together, then find its twin.' }
  };
  const SKILL_IDS = Object.keys(SKILLS);

  /* ---------- State, settings and stats ---------- */
  const els = {
    prompt: $('#prompt'), answers: $('#answers'), stickers: $('#stickers'), stage: $('#stage'),
    replayBtn: $('#replayBtn'), parentBtn: $('#parentBtn'), hand: $('#hand'),
    intro: $('#intro'), introMascot: $('#introMascot'), introIcon: $('#introIcon'), introInner: $('#introInner'), introLabel: $('#introLabel'),
    yourTurn: $('#yourTurn'), caption: $('#caption'), watch: $('#watch'),
    start: $('#start'), playBtn: $('#playBtn'), parade: $('#parade'), startParentBtn: $('#startParentBtn'), trophy: $('#trophy'),
    sheet: $('#parentSheet'), skillRows: $('#skillRows'), soundToggle: $('#soundToggle'), closeParent: $('#closeParent'),
    voiceTest: $('#voiceTest'), voiceStatus: $('#voiceStatus'), sessionPills: $('#sessionPills'), tipsToggle: $('#tipsToggle')
  };

  const S = {
    started: false, skill: null, last: null, forced: null, q: null, block: null,
    busy: false, inIntro: false, inDemo: false, wrongs: 0, counted: 0, jpos: 0, startAt: 0,
    stickers: [], timers: [], idle: 0, introDone: null, demoDone: null, explainTimer: 0,
    playMs: 0, timeUp: false
  };
  const later = (fn, ms) => { const id = setTimeout(fn, ms); S.timers.push(id); return id; };
  function clearTimers() { S.timers.forEach(clearTimeout); S.timers = []; clearTimeout(S.idle); clearTimeout(S.explainTimer); }

  let enabled = store.get('enabled', SKILL_IDS.slice());
  enabled = Array.isArray(enabled) ? enabled.filter((id) => SKILLS[id]) : SKILL_IDS.slice();
  if (!enabled.length) enabled = SKILL_IDS.slice();
  const SESSION_CHOICES = [5, 8, 10, 15, 0]; // minutes; 0 = no limit
  let sessionMin = store.get('sessionMin', 5);
  if (!SESSION_CHOICES.includes(sessionMin)) sessionMin = 5;
  let showTips = store.get('tips', true) !== false;

  // Per-skill record, kept on this device: the later "adjust difficulty" step reads it.
  const stats = store.get('stats', {}) || {};
  SKILL_IDS.forEach((id) => {
    stats[id] = Object.assign({ level: 1, tries: 0, correct: 0, firstTry: 0, totalMs: 0, misses: 0, taps: [0, 0], recentMisses: [] }, stats[id]);
  });
  const saveStats = () => store.set('stats', stats);

  /* ---------- Question flow: blocks of one game, each opened with intro + demo ---------- */
  const inRotation = () => {
    const on = enabled.filter((id) => !SKILLS[id].paused);
    return on.length ? on : SKILL_IDS.filter((id) => !SKILLS[id].paused);
  };
  const blockSize = () => randInt(CONFIG.blockMin, CONFIG.blockMax);

  function applySkillLook(id) {
    const sk = SKILLS[id];
    document.documentElement.style.setProperty('--skill-bg', sk.bg);
    document.documentElement.style.setProperty('--skill-edge', sk.edge);
  }

  function nextQuestion() {
    clearTimers();
    hideHand();
    if (S.timeUp && !S.forced) { endSession(); return; }
    let id;
    if (S.forced && SKILLS[S.forced]) {
      id = S.forced;
      S.forced = null;
    } else if (S.block && S.block.left > 0 && inRotation().includes(S.block.skill)) {
      S.block.left -= 1;
      ask(S.block.skill);
      return;
    } else {
      const all = inRotation();
      const pool = all.filter((x) => x !== S.last);
      id = pick(pool.length ? pool : all);
    }
    S.block = { skill: id, left: blockSize() - 1 };
    S.skill = id;
    S.last = id;
    S.busy = true;
    showIntro(id, () => runDemo(id, (demoQ) => ask(id, demoQ)));
  }

  function showIntro(id, then) {
    const sk = SKILLS[id];
    applySkillLook(id);
    els.prompt.innerHTML = '';
    els.answers.innerHTML = '';
    els.introMascot.textContent = sk.mascot;
    els.introIcon.textContent = sk.icon;
    els.introLabel.textContent = sk.label;
    restartAnim(els.introInner, 'intro-inner');
    els.intro.hidden = false;
    S.inIntro = true;
    Sound.jingle(sk.notes);
    S.introDone = () => {
      if (!S.inIntro) return;
      S.inIntro = false;
      els.intro.hidden = true;
      then();
    };
    later(S.introDone, CONFIG.introMs);
  }

  function renderQuestion(id, q) {
    const sk = SKILLS[id];
    els.prompt.innerHTML = `<div class="tag"><span class="mascot emoji" aria-hidden="true">${sk.mascot}</span><span class="tag-text">${sk.label}</span></div>${q.prompt}`;
    if (q.kind === 'jumble') {
      els.answers.innerHTML = q.tiles.map((l, i) =>
        `<button class="tile" type="button" data-l="${l}" style="--i:${i}" aria-label="${LETTER_NAME[l]}">${l}</button>`).join('');
    } else {
      els.answers.innerHTML = q.choices.map((c, i) =>
        `<button class="card ${c.cls || ''}" type="button" data-i="${i}" data-label="${c.label}" style="--i:${i}" aria-label="${c.label}">${c.html}</button>`).join('');
    }
    if (q.after) q.after();
  }

  /* ---------- Demo: the hand plays one example, then "Your turn!" ---------- */
  function hideHand() { els.hand.hidden = true; }

  function moveHandTo(el, tap) {
    if (!el) return;
    const hand = els.hand;
    if (hand.hidden) {
      hand.style.transition = 'none';
      hand.style.transform = `translate(${window.innerWidth / 2 - 30}px, ${window.innerHeight + 20}px)`;
      hand.hidden = false;
      void hand.offsetWidth;
      hand.style.transition = '';
    }
    const r = el.getBoundingClientRect();
    hand.style.transform = `translate(${r.left + r.width / 2 - 24}px, ${r.top + r.height * 0.55}px)`;
    if (tap) later(() => restartAnim(hand, 'tap'), CONFIG.demoStepMs * 0.55);
  }

  function fillQmark(q) {
    const qm = els.prompt.querySelector('.qmark');
    if (qm && q.fill) { qm.innerHTML = q.fill; qm.classList.add('done'); qm.classList.remove('broken'); }
  }

  function runDemo(id, then) {
    const sk = SKILLS[id];
    const q = sk.make(stats[id].level);
    S.q = q;
    S.inDemo = true;
    S.busy = true;
    renderQuestion(id, q);
    els.stage.classList.add('demo');
    els.watch.hidden = false;
    if (showTips) { els.caption.textContent = `Grown-ups: ${sk.tip}`; els.caption.hidden = false; }
    const T = CONFIG.demoStepMs;
    let t = (q.kind !== 'jumble' && id === 'addition') ? CONFIG.joinMs + T : T;
    const step = (fn) => { later(fn, t); t += T; };
    step(() => moveHandTo(els.prompt.querySelector('.bubble, .group, .pattern, .jumble')));
    if (q.kind === 'jumble') {
      q.word.split('').forEach((l) => step(() => {
        const tile = els.answers.querySelector(`.tile[data-l="${l}"]:not(.used)`);
        moveHandTo(tile, true);
        later(() => placeTile(tile), T * 0.6);
      }));
    } else {
      for (let k = 0; k < (q.countTo || 0); k++) {
        step(() => {
          const c = qs('.critter:not(.gone)')[k];
          moveHandTo(c, true);
          later(() => markCounted(c, k + 1), T * 0.6);
        });
      }
      step(() => {
        const card = els.answers.querySelector(`.card[data-i="${q.answer}"]`);
        moveHandTo(card, true);
        later(() => { card.classList.add('right'); fillQmark(q); Sound.chime(); }, T * 0.6);
      });
    }
    step(() => { hideHand(); els.yourTurn.hidden = false; restartAnim(els.yourTurn, 'show'); Sound.pop(6); });
    t += CONFIG.yourTurnMs - T;
    const finish = () => {
      if (!S.inDemo) return;
      S.inDemo = false;
      S.demoDone = null;
      els.yourTurn.hidden = true;
      els.caption.hidden = true;
      els.watch.hidden = true;
      els.stage.classList.remove('demo');
      hideHand();
      then(q);
    };
    // Tapping during the demo skips it.
    S.demoDone = () => { clearTimers(); finish(); };
    later(finish, t);
  }

  function ask(id, avoid) {
    const sk = SKILLS[id];
    let q = sk.make(stats[id].level);
    // Don't repeat the demo's example as the first real question.
    for (let i = 0; i < 10 && avoid && JSON.stringify(q.data) === JSON.stringify(avoid.data); i++) q = sk.make(stats[id].level);
    S.q = q;
    S.skill = id;
    S.busy = false;
    S.wrongs = 0;
    S.counted = 0;
    S.jpos = 0;
    renderQuestion(id, q);
    Voice.say(q.say);
    S.startAt = performance.now();
    stats[id].tries += 1;
    saveStats();
    armIdle();
  }

  function armIdle() {
    clearTimeout(S.idle);
    S.idle = setTimeout(() => {
      if (!S.q || S.busy || S.inIntro || S.inDemo || !els.sheet.hidden) return;
      Voice.say(S.q.say);
      pointAtAnswers();
      armIdle();
    }, CONFIG.idleHintMs);
  }

  // Idle hint: the hand visits each answer (it never picks one).
  function pointAtAnswers() {
    const targets = [...els.answers.querySelectorAll('.card, .tile:not(.used)')].slice(0, 4);
    targets.forEach((tg, i) => later(() => moveHandTo(tg, true), 150 + i * 1000));
    later(hideHand, 150 + targets.length * 1000 + 400);
  }

  /* ---------- Answering ---------- */
  function choose(card) {
    if (S.busy || S.inIntro || S.inDemo) return;
    armIdle();
    clearExplain();
    const i = Number(card.dataset.i);
    const st = stats[S.skill];
    st.taps[i] = (st.taps[i] || 0) + 1;
    if (i === S.q.answer) right(card);
    else wrong(card);
  }

  function clearExplain() {
    clearTimeout(S.explainTimer);
    if (S.q && S.q.unexplain) S.q.unexplain();
  }

  // A wrong pick stays on screen and can be tried again. The game shows why it doesn't fit,
  // and only after several tries does the right card start to pulse (it is never picked for him).
  function wrong(card) {
    S.wrongs += 1;
    const st = stats[S.skill];
    st.misses += 1;
    st.recentMisses = [...st.recentMisses, { picked: card.dataset.label, right: S.q.choices[S.q.answer].label }].slice(-10);
    saveStats();
    Sound.boop();
    restartAnim(card, 'wrong');
    Voice.say(S.q.retry || 'Try again!');
    if (S.q.explain) {
      S.q.explain(card.dataset.label);
      S.explainTimer = setTimeout(clearExplain, CONFIG.explainMs);
    }
    const rightCard = els.answers.querySelector(`.card[data-i="${S.q.answer}"]`);
    if (S.wrongs >= CONFIG.hintAfter) rightCard.classList.add('hint');
    if (S.wrongs >= CONFIG.glowAfter) rightCard.classList.add('glow');
  }

  function right(el) {
    S.busy = true;
    clearTimeout(S.idle);
    clearExplain();
    hideHand();
    if (el) { el.classList.remove('glow', 'hint'); el.classList.add('right'); }
    fillQmark(S.q);
    Sound.chime();
    Sound.applause(1.2);
    FX.confetti(45);
    Voice.say(S.q.praise);
    const st = stats[S.skill];
    st.correct += 1;
    if (!S.wrongs) st.firstTry += 1;
    st.totalMs += Math.round(performance.now() - S.startAt);
    saveStats();
    addSticker();
    later(() => (S.stickers.length >= 5 ? bigParty() : nextQuestion()), CONFIG.rightPauseMs);
  }

  /* ---------- Word jumble tiles ---------- */
  function placeTile(tile) {
    const pos = Number(els.prompt.querySelectorAll('.jslot.filled').length);
    const slot = els.prompt.querySelector(`.jslot[data-i="${pos}"]`);
    tile.classList.remove('glow');
    tile.classList.add('used');
    slot.textContent = tile.dataset.l;
    slot.classList.remove('next');
    slot.classList.add('filled');
    els.prompt.querySelector(`.jslot[data-i="${pos + 1}"]`)?.classList.add('next');
    Sound.pop(pos * 3);
    return pos + 1;
  }

  function tapTile(tile) {
    if (S.busy || S.inIntro || S.inDemo || tile.classList.contains('used')) return;
    armIdle();
    const word = S.q.word;
    const need = word[S.jpos];
    if (tile.dataset.l !== need) {
      S.wrongs += 1;
      stats[S.skill].misses += 1;
      saveStats();
      Sound.boop();
      // The tile tries the empty slot and bounces back: it doesn't fit there.
      restartAnim(tile, 'nofit');
      const slot = els.prompt.querySelector(`.jslot[data-i="${S.jpos}"]`);
      if (slot) restartAnim(slot, 'nope');
      Voice.say(`Find ${LETTER_NAME[need]}.`);
      if (S.wrongs >= CONFIG.hintAfter) els.answers.querySelector(`.tile[data-l="${need}"]:not(.used)`)?.classList.add('glow');
      return;
    }
    S.jpos = placeTile(tile);
    if (S.jpos === word.length) { right(null); return; }
    Voice.say(`${LETTER_NAME[need]}! Now ${LETTER_NAME[word[S.jpos]]}.`);
  }

  /* ---------- Counting taps on the animals in a question ---------- */
  function markCounted(c, n) {
    if (!c) return;
    restartAnim(c, 'pop');
    c.classList.add('counted');
    c.insertAdjacentHTML('beforeend', `<span class="badge">${n}</span>`);
    Sound.pop(n);
  }

  function tapCritter(c) {
    if (S.busy || S.inIntro || S.inDemo || c.classList.contains('gone') || c.classList.contains('counted') || c.classList.contains('food')) {
      restartAnim(c, 'pop');
      Sound.pop(2);
      return;
    }
    armIdle();
    S.counted += 1;
    markCounted(c, S.counted);
    Voice.say(String(S.counted));
    // Counted them all: the last number counted is "how many", so its card lights up.
    if (S.q.countTo && S.counted === qs('.critter:not(.gone)').length) {
      const card = els.answers.querySelector(`.card[data-label="${S.counted}"]`);
      if (card) card.classList.add('hint');
    }
  }

  /* ---------- Stickers, the big celebration and the end of a session ---------- */
  function renderStickers() {
    els.stickers.innerHTML = Array.from({ length: 5 }, (_, i) =>
      `<span class="slot-sticker${S.stickers[i] ? ' on' : ''}"><span class="emoji">${S.stickers[i] || ''}</span></span>`).join('');
  }

  function addSticker() {
    S.stickers.push(pick(STICKERS));
    renderStickers();
  }

  function bigParty() {
    S.busy = true;
    Sound.fanfare();
    Sound.applause(3);
    FX.celebrate();
    Voice.say('Hooray! Five stickers! You are a superstar!');
    els.prompt.innerHTML = `<div class="parade">${SKILL_IDS.filter((id) => !SKILLS[id].paused).map((id, i) => `<span style="--i:${i}">${SKILLS[id].mascot}</span>`).join('')}</div>`;
    els.answers.innerHTML = '';
    later(() => {
      S.stickers = [];
      renderStickers();
      nextQuestion();
    }, CONFIG.bigPartyMs);
  }

  // Session length (grown-ups setting): when time is up the current question finishes,
  // then a trophy screen ends the session on a high.
  function endSession() {
    S.started = false;
    S.busy = true;
    S.block = null;
    Sound.fanfare();
    FX.celebrate();
    Voice.say('All done! Great playing!');
    els.trophy.hidden = false;
    els.start.hidden = false;
  }

  setInterval(() => {
    if (!S.started || document.hidden || !els.sheet.hidden || S.timeUp) return;
    S.playMs += 1000;
    if (sessionMin && S.playMs >= sessionMin * 60000) S.timeUp = true;
  }, 1000);

  /* ---------- Grown-ups sheet (press and hold ⚙️) ---------- */
  function renderParent() {
    els.soundToggle.textContent = Sound.muted ? 'Off' : 'On';
    els.soundToggle.classList.toggle('on', !Sound.muted);
    els.tipsToggle.textContent = showTips ? 'On' : 'Off';
    els.tipsToggle.classList.toggle('on', showTips);
    els.sessionPills.innerHTML = SESSION_CHOICES.map((m) =>
      `<button class="pill${m === sessionMin ? ' on' : ''}" type="button" data-min="${m}">${m ? `${m} min` : 'No limit'}</button>`).join('');
    els.skillRows.innerHTML = SKILL_IDS.map((id) => {
      const sk = SKILLS[id], st = stats[id], on = enabled.includes(id) && !sk.paused;
      const avg = st.correct ? `${(st.totalMs / st.correct / 1000).toFixed(1)} s each` : '–';
      const taps = st.taps[0] + st.taps[1];
      const side = taps >= 6 ? ` · picks left ${Math.round((st.taps[0] / taps) * 100)}%` : '';
      const last = st.recentMisses.length ? ` · last mix-up: picked ${st.recentMisses[st.recentMisses.length - 1].picked} for ${st.recentMisses[st.recentMisses.length - 1].right}` : '';
      return `<div class="skill-row" data-skill="${id}">
        <span class="emoji" aria-hidden="true">${sk.mascot}</span>
        <span>${sk.name} · level ${st.level}<br><span class="stat">${st.tries} tried · ${st.correct} right · ${st.firstTry} first try · ${st.misses} wrong taps · ${avg}${side}${last}</span></span>
        ${sk.paused
          ? '<span class="pill paused">Paused</span>'
          : `<button class="pill${on ? ' on' : ''}" type="button" data-toggle="${id}" aria-pressed="${on}">${on ? 'On' : 'Off'}</button>`}
        <button class="pill try" type="button" data-try="${id}">Try now</button>
      </div>`;
    }).join('');
  }

  function openParent() {
    clearTimeout(S.idle);
    Voice.cancel();
    renderParent();
    els.voiceStatus.textContent = Voice.describe();
    els.sheet.hidden = false;
  }

  function closeParent() {
    els.sheet.hidden = true;
    if (S.started && S.q && !S.busy) armIdle();
  }

  function toggleSkill(id) {
    if (SKILLS[id].paused) return;
    if (enabled.includes(id)) {
      if (enabled.filter((x) => !SKILLS[x].paused).length === 1) return; // keep at least one skill on
      enabled = enabled.filter((x) => x !== id);
    } else {
      enabled = SKILL_IDS.filter((x) => x === id || enabled.includes(x));
    }
    store.set('enabled', enabled);
    renderParent();
  }

  function tryNow(id) {
    els.sheet.hidden = true;
    S.forced = id;
    if (!S.started) startPlaying();
    else nextQuestion();
  }

  // Press and hold so a toddler's quick tap never opens the grown-ups sheet.
  function holdToOpen(btn) {
    let timer = 0;
    const cancel = () => { clearTimeout(timer); btn.classList.remove('holding'); };
    btn.style.setProperty('--hold', CONFIG.holdMs + 'ms');
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      btn.classList.add('holding');
      timer = setTimeout(() => { cancel(); openParent(); }, CONFIG.holdMs);
    });
